<script id="ui">
/* =====================================================================
   UI 層
   ===================================================================== */
const $=s=>document.querySelector(s);
const app=$('#app');
let G=null;
let ALLOC={},INTENS='normal',ATT='steady';
let PANEL=null;   /* 記分板上展開的面板：'attrs' | 'load' | null */

/* ---- 皮膚與字級 ---- */
const root=document.documentElement;
let skinPinned=false;   /* 使用者手動選過皮膚後，就不再跟著檢視器主題跑 */
function preferredSkin(){
  const t=root.getAttribute('data-theme');
  if(t==='dark') return 'scoreboard';
  if(t==='light') return 'wood';
  return (window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'wood':'scoreboard';
}
(function initSkin(){
  root.setAttribute('data-skin',preferredSkin());
  syncSkinBtns();
  if(window.matchMedia){
    const mq=window.matchMedia('(prefers-color-scheme: light)');
    const onChange=()=>{ if(!skinPinned){ root.setAttribute('data-skin',preferredSkin()); syncSkinBtns(); } };
    if(mq.addEventListener) mq.addEventListener('change',onChange); else if(mq.addListener) mq.addListener(onChange);
  }
  if(window.MutationObserver){
    new MutationObserver(()=>{ if(!skinPinned){ root.setAttribute('data-skin',preferredSkin()); syncSkinBtns(); } })
      .observe(root,{attributes:true,attributeFilter:['data-theme']});
  }
})();
function syncSkinBtns(){
  const cur=root.getAttribute('data-skin');
  document.querySelectorAll('[data-skin-btn]').forEach(b=>{
    b.setAttribute('aria-pressed',String(b.dataset.skinBtn===cur));
  });
}
document.querySelectorAll('[data-skin-btn]').forEach(b=>{
  b.addEventListener('click',()=>{ skinPinned=true; root.setAttribute('data-skin',b.dataset.skinBtn); syncSkinBtns(); });
});
$('#fsBtn').addEventListener('click',function(){
  const on=root.getAttribute('data-fs')==='lg';
  if(on) root.removeAttribute('data-fs'); else root.setAttribute('data-fs','lg');
  this.setAttribute('aria-pressed',String(!on));
});

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800);
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* 複製：navigator.clipboard 只在安全情境下存在，用 file:// 直接開這個檔時是 undefined
   （不是回傳失敗的 Promise，是整個物件不存在）。所以要先探再退回舊做法，
   不然單機版按下去會直接丟 TypeError。 */
function copyText(txt,okMsg){
  const ok=()=>toast(okMsg||'已複製生涯摘要'), no=()=>toast('複製失敗，請手動選取');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok,()=>fallbackCopy(txt)?ok():no());
    return;
  }
  fallbackCopy(txt)?ok():no();
}
function fallbackCopy(txt){
  try{
    const ta=document.createElement('textarea');
    ta.value=txt;
    ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0,txt.length);
    const done=document.execCommand&&document.execCommand('copy');
    document.body.removeChild(ta);
    return !!done;
  }catch(e){ return false; }
}

/* =========================== 開場 =========================== */
function urlSeed(){
  const m=location.search.match(/[?&]seed=([a-z0-9]+)/i);
  return m?m[1]:null;
}
function urlPick(k,valid,fallback){
  const m=location.search.match(new RegExp('[?&]'+k+'=([A-Za-z0-9]+)','i'));
  return m&&valid.indexOf(m[1])>=0?m[1]:fallback;
}
/* 網址要能直接分享一局：開始生涯時把 種子／位置／球風 寫進網址，
   別人貼上就是同一段人生的起點。名字不進亂數，所以不必帶。
   用 replaceState 不用 pushState——不要讓「上一頁」變成回到開局前。 */
function syncUrl(sd,pos,sty){
  try{
    history.replaceState(null,'',location.pathname
      +`?seed=${encodeURIComponent(sd)}&pos=${pos}&style=${sty}`);
  }catch(e){ /* 少數瀏覽器在 file:// 下會擋 replaceState，擋掉不影響遊戲 */ }
}
function clearUrl(){ try{ history.replaceState(null,'',location.pathname); }catch(e){} }
function shareUrl(){
  return location.origin==='null'||location.protocol==='file:'
    ? null                                   /* 本機開的檔案沒有可以分享的網址 */
    : location.origin+location.pathname+location.search;
}
function randomSeed(){ return makeSeed(Math.random); }

function renderStart(){
  const seed=urlSeed()||randomSeed();
  const rn=mulberry32(cyrb128('name|'+seed));
  const defName=pick(rn,SURNAME)+pick(rn,NAMES_A)+pick(rn,NAMES_B);
  app.innerHTML=`
  <div class="hero">
    <div class="mark">Basketball Life Simulator</div>
    <h1>籃球人生</h1>
    <p class="sub">從高中球隊的撿球員開始，走到你走得到的最遠的地方。</p>
    <div class="path">HBL 高中三年 → UBA／NCAA → 職籃選秀 → P.LEAGUE+／T1<br>
    → 日本 B1 → 韓國 KBL → 澳洲 NBL → 歐洲 → G LEAGUE → NBA<br>
    <span style="color:var(--accent)">每一層都有門檻，綜合不夠就出不去。</span></div>
  </div>
  <div class="dock-in">
    <div class="field">
      <label for="nameIn">球員姓名</label>
      <input id="nameIn" value="${esc(defName)}" maxlength="12" autocomplete="off">
    </div>
    <div class="field">
      <label>先發位置</label>
      <div class="posgrid" id="posGrid">
        ${Object.keys(POS).map((k,i)=>`
          <button class="posbtn" data-pos="${k}" aria-pressed="${i===2}">
            <b>${k}</b><span>${POS[k].n}</span>
          </button>`).join('')}
      </div>
      <p class="posdesc" id="posDesc">${POS.SF.d}</p>
    </div>
    <div class="field">
      <label>球風（決定你練得動什麼）</label>
      <div class="stygrid" id="styGrid">
        ${STYLE_KEYS.map((k,i)=>`
          <button class="stybtn" data-sty="${k}" aria-pressed="${i===0}">${STYLES[k].n}</button>`).join('')}
      </div>
      <p class="posdesc" id="styDesc">${STYLES.allround.d}</p>
    </div>
    <div class="field">
      <label for="seedIn">世界種子（相同種子＋相同選擇＝相同人生）</label>
      <input id="seedIn" value="${esc(seed)}" maxlength="24" autocomplete="off">
    </div>
    <button class="btn" id="startBtn">開始生涯 ▸ 高一春天</button>
    <div class="btn-row">
      <button class="btn ghost" id="reseedBtn">換一個種子</button>
    </div>
    <p class="hint">身高、天賦上限與<b>天生體質</b>由種子決定，開局就已經寫好了。
      你能決定的是球風、每一季的訓練點數往哪裡放，以及每一次要不要賭。</p>
  </div>`;

  let pos=urlPick('pos',Object.keys(POS),'SF'),sty=urlPick('style',STYLE_KEYS,'allround');
  /* 網址帶了位置／球風就把畫面對上，不然分享出去的連結會開出不一樣的人 */
  if(pos!=='SF'||sty!=='allround'){
    document.querySelectorAll('.posbtn').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.pos===pos)));
    $('#posDesc').textContent=POS[pos].d;
    document.querySelectorAll('.stybtn').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.sty===sty)));
    $('#styDesc').textContent=STYLES[sty].d;
  }
  $('#posGrid').addEventListener('click',e=>{
    const b=e.target.closest('.posbtn'); if(!b) return;
    pos=b.dataset.pos;
    document.querySelectorAll('.posbtn').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    $('#posDesc').textContent=POS[pos].d;
  });
  $('#styGrid').addEventListener('click',e=>{
    const b=e.target.closest('.stybtn'); if(!b) return;
    sty=b.dataset.sty;
    document.querySelectorAll('.stybtn').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    $('#styDesc').textContent=STYLES[sty].d;
  });
  $('#reseedBtn').addEventListener('click',()=>{ $('#seedIn').value=randomSeed(); });
  $('#startBtn').addEventListener('click',()=>{
    const nm=($('#nameIn').value||'').trim()||defName;
    const sd=($('#seedIn').value||'').trim()||seed;
    G=createGame(sd,nm,pos,sty);
    ALLOC={};INTENS='normal';ATT='steady';PANEL=null;
    syncUrl(sd,pos,sty);
    render();
    window.scrollTo(0,0);
  });
}

/* =========================== 主畫面 =========================== */
function render(){
  if(!G){ renderStart(); return; }
  if(G.phase==='end'){ renderEnd(); return; }
  app.innerHTML=board()+`<div class="log" id="log">${G.log.slice(-7).map(cardHTML).join('')}</div>`+dock();
  wireBoard(); wireDock();
}
function wireBoard(){
  const b=document.querySelector('.board'); if(!b) return;
  b.addEventListener('click',e=>{
    const t=e.target;
    if(t.closest('#attrBtn'))      { PANEL=PANEL==='attrs'?null:'attrs'; render(); }
    else if(t.closest('#loadBtn')) { PANEL=PANEL==='load' ?null:'load';  render(); }
    else if(t.closest('#scoutBtn')){ PANEL=PANEL==='scout'?null:'scout'; render(); }
  });
}

function board(){
  const ovr=overall(G);
  const band=loadBand(G.load);
  const loadColor=band.k==='danger'?'var(--bad)':band.k==='warn'?'var(--warn)':'var(--good)';
  const R=ROLES[G.role]||ROLES.starter;
  return `<div class="board">
    <div class="board-top">
      <span class="board-name">${esc(G.name)}</span>
      <span class="board-pos">${G.pos}</span>
      <span class="board-sty">${esc(STYLES[G.style].n)}</span>
      <span class="board-team">${esc(G.team)}<br>${LEAGUES[G.league].n}</span>
    </div>
    <div class="board-grid">
      <div class="cell"><div class="k">年齡</div><div class="v">${G.age}</div></div>
      <div class="cell"><div class="k">綜合</div><div class="v hi">${ovr}</div></div>
      <div class="cell"><div class="k">隊上定位</div><div class="v rl ${G.role}">${R.n}</div></div>
      <div class="cell"><div class="k">生涯薪</div><div class="v">${Math.round(G.money).toLocaleString()}<span class="u">萬</span></div></div>
    </div>
    <button class="loadbar" id="loadBtn" aria-expanded="${PANEL==='load'}">
      <div class="lb-top"><span>膝蓋負荷 · ${band.n}</span><b>${Math.round(G.load)} / 100　${PANEL==='load'?'▲':'▼'}</b></div>
      <div class="track"><div class="fill" style="width:${G.load}%;background:${loadColor}"></div></div>
    </button>
    <div class="board-btns">
      <button class="tbtn" id="attrBtn"  aria-expanded="${PANEL==='attrs'}">九項能力值 ${PANEL==='attrs'?'▲':'▼'}</button>
      <button class="tbtn" id="scoutBtn" aria-expanded="${PANEL==='scout'}">球探報告 ${PANEL==='scout'?'▲':'▼'}</button>
    </div>
    ${PANEL==='attrs'?attrPanel():''}
    ${PANEL==='load'?loadPanel():''}
    ${PANEL==='scout'?scoutPanel():''}
  </div>`;
}
function attrPanel(){
  const ST=STYLES[G.style];
  const gk=Object.keys(ST.grow);

function attrName(k){ return (ATTRS.find(a=>a.k===k)||{}).n||k; }
/* 屬性列：now 填滿到當下值，當下值處插一根亮游標，天賦上限處插一根刻度 */
function attrRow(at,o){
  const cur=G.a[at.k],cap=o.cap,gain=o.gain||0,add=o.add||0;
  /* 已經分配的點數也算進去：再加下去只會被天賦上限吃掉，那顆＋要直接停用 */
  const maxed=(cur+gain)>=cap-0.05;
  const w=POS[G.pos].w[at.k]||0;
  return `<div class="arow">
    <span class="nm${w>=0.14?' key':''}">${at.n}</span>
    <span class="bar">
      <span class="now" style="width:${cur}%"></span>
      ${gain>0?`<span class="add" style="left:${cur}%;width:${Math.min(gain,99-cur)}%"></span>`:''}
      <span class="cap" style="left:${cap}%" title="天賦上限 ${cap}"></span>
      <span class="cur" style="left:${cur}%" title="目前 ${cur.toFixed(1)}"></span>
    </span>
    <span class="num"><b>${cur.toFixed(1)}</b>${gain>0?`<i>+${gain.toFixed(1)}</i>`:''}<u>/${cap}</u></span>
    ${o.edit?`<span class="pm">
      <button data-dec="${at.k}" ${add<=0?'disabled':''} aria-label="${at.n} 減少">−</button>
      <button data-inc="${at.k}" ${o.left<=0||maxed?'disabled':''} aria-label="${at.n} 增加">＋</button>
    </span>`:''}
  </div>`;
}
function deltaHTML(ds){

      /* 同儕定位：讓玩家知道這個綜合在這個聯盟裡到底算什麼 */

        <button class="opt" data-int="${it.k}" ${it.k===INTENS?'style="border-color:var(--accent)"':''}>

    <div class="pool two">

      <div class="pr"><span>這樣分配的綜合</span>
        <b>${ovrNow.toFixed(1)} → <em>${ovrNext.toFixed(1)}</em></b>

function wireDock(){
  const d=document.querySelector('.dock'); if(!d) return;
  d.addEventListener('click',e=>{
    const t=e.target;
    const intBtn=t.closest('[data-int]');
    if(intBtn){ INTENS=intBtn.dataset.int; clampAlloc(); render(); return; }
    const attBtn=t.closest('[data-att]');
    if(attBtn){ ATT=attBtn.dataset.att; render(); return; }
    const inc=t.closest('[data-inc]');
    if(inc){ const k=inc.dataset.inc; ALLOC[k]=(ALLOC[k]||0)+1; render(); return; }
    const dec=t.closest('[data-dec]');
    if(dec){ const k=dec.dataset.dec; ALLOC[k]=Math.max(0,(ALLOC[k]||0)-1); render(); return; }
    if(t.closest('#autoBtn')){ autoAlloc(); render(); return; }
    if(t.closest('#resetBtn')){ resetAlloc(); render(); return; }
    if(t.closest('#doTrain')){
      applyTrain(G,INTENS,ALLOC,ATT); ALLOC={}; render(); scrollLog(); return;
    }
    const ev=t.closest('[data-ev]');
    if(ev){ applyEvent(G,+ev.dataset.ev); render(); scrollLog(); return; }
    if(t.closest('#nextBtn')){
      advance(G);
      if(G.phase==='end'){ renderEnd(); return; }
      ALLOC={};INTENS='normal';ATT='steady';
      render(); scrollLog(); return;
    }
    const br=t.closest('[data-br]');
    if(br){
      applyBranch(G,+br.dataset.br);
      if(G.phase==='end'){ renderEnd(); return; }
      ALLOC={};INTENS='normal';ATT='steady';
      render(); scrollLog(); return;
    }
  });
}
function clampAlloc(){
  const pts=trainPoints(G,INTENS);
  let used=Object.values(ALLOC).reduce((s,v)=>s+v,0);
  const keys=Object.keys(ALLOC);
  while(used>pts&&keys.length){
    for(let i=keys.length-1;i>=0&&used>pts;i--){
      if(ALLOC[keys[i]]>0){ ALLOC[keys[i]]--; used--; }
    }
  }
}
function autoAlloc(){
  const pts=trainPoints(G,INTENS);
  ALLOC={};
  const w=POS[G.pos].w;
  /* gainFor 的第三個參數是「已累積的成長值」，不是點數。
     之前傳點數會低估已投入的進度，害貪婪法一直往同一項倒點。 */
  const acc={};
  let left=pts;
  while(left>0){
    let best=null,bs=-1,bg=0;
    for(const at of ATTRS){
      const g0=gainFor(G,at.k,acc[at.k]||0);
      if(g0<=0) continue;
      if(G.a[at.k]+(acc[at.k]||0)>=G.pot[at.k]) continue;
      const s=(w[at.k]||0.01)*g0;
      if(s>bs){ bs=s; best=at.k; bg=g0; }
    }
    if(!best) break;
    ALLOC[best]=(ALLOC[best]||0)+1;
    acc[best]=(acc[best]||0)+bg;
    left--;
  }
}
function resetAlloc(){ ALLOC={}; }
function scrollLog(){
  requestAnimationFrame(()=>{
    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({top:document.body.scrollHeight,behavior:reduce?'auto':'smooth'});
  });
}

/* =========================== 生涯履歷 =========================== */
const lgKey=short=>Object.keys(LEAGUES).find(k=>LEAGUES[k].short===short);
function renderEnd(){
  const s=G.summary,c=G.career,S=G.seasons;
  const played=S.filter(x=>!x.miss&&x.gp>0);
  const topLg=S.reduce((m,x)=>{
    const k=lgKey(x.lg),mk=lgKey(m);
    return (k&&mk&&LEAGUES[k].tier>LEAGUES[mk].tier)?x.lg:m;},'HBL');

  /* 分聯盟統計 */
  const byLg=[];
  for(const x of S){
    let e=byLg.find(z=>z.lg===x.lg);
    if(!e){ e={lg:x.lg,seasons:0,gp:0,pts:0,reb:0,ast:0,champs:0,awards:0,y0:x.y,y1:x.y,roles:{}}; byLg.push(e); }
    e.seasons++; e.gp+=x.gp; e.pts+=x.pts*x.gp; e.reb+=x.reb*x.gp; e.ast+=x.ast*x.gp;
    e.champs+=x.champ?1:0; e.awards+=x.awards.length; e.y1=x.y;
    if(x.role) e.roles[x.role]=(e.roles[x.role]||0)+1;
  }
  /* 每個聯盟取出現最多次的定位（同票時取較高的） */
  byLg.forEach(e=>{ e.role=ROLE_ORDER.reduce((m,k)=>
    (e.roles[k]||0)>(e.roles[m]||0)?k:m,ROLE_ORDER[ROLE_ORDER.length-1]); });
  byLg.sort((a,b)=>(LEAGUES[lgKey(b.lg)]||{tier:0}).tier-(LEAGUES[lgKey(a.lg)]||{tier:0}).tier);

  /* 巔峰球季：用「得分＋籃板＋助攻」加權挑最好的一季 */
  const peak=played.slice().sort((a,b)=>
    (b.pts+b.reb*1.2+b.ast*1.5+b.awards.length*4)-(a.pts+a.reb*1.2+a.ast*1.5+a.awards.length*4))[0];

  /* 獎項分類 */
  const cnt=t=>G.awards.filter(a=>a.t===t).length;
  const mvpY=G.awards.filter(a=>a.t.indexOf('年度 MVP')>=0);
  const fmvp=cnt('總冠軍賽 MVP');
  const otherAw={};
  G.awards.forEach(a=>{ if(a.t.indexOf('年度 MVP')<0&&a.t!=='總冠軍賽 MVP'&&a.t.indexOf('冠軍')<0)
    otherAw[a.t]=(otherAw[a.t]||0)+1; });

  const goodT=G.traits.filter(t=>TRAITS[t]&&TRAITS[t].good);
  const badT=G.traits.filter(t=>TRAITS[t]&&!TRAITS[t].good);
  const whyTxt={washed:'實力跟不上，市場上沒有人開價',broken:'傷太多，醫生勸退',
    nomarket:'年紀到了，沒有球隊再打電話來',undrafted:'選秀落選，沒能踏進職業',
    choice:'自己決定在還走得動的時候離開'}[G.retiredWhy]||'';
  const injMinor=S.filter(x=>x.injury==='minor').length;
  const injSevere=G.injuries;

  app.innerHTML=`
  <div class="hero" style="padding:20px 0 10px">
    <div class="mark">Career Résumé</div>
    <h1 style="font-size:1.6em">${esc(G.name)}</h1>
    <p class="sub">${G.pos} ${POS[G.pos].n} · ${esc(STYLES[G.style].n)} · ${G.height} 公分<br>
      ${S[0]?S[0].y:G.year} – ${G.year}　${S.length} 個球季　${G.age} 歲退休</p>
  </div>
  <div class="resume">
    <div class="resume-hd">
      <div class="t">Final Grade</div>
      <h2>${s.grade.g} — ${s.grade.t}</h2>
      <div class="g">最高殿堂 ${esc(topLg)}　·　生涯最高綜合 ${s.bestOvr}${whyTxt?'　·　'+esc(whyTxt):''}</div>
    </div>
    <div class="resume-bd">

      ${G.afterlife?`<div class="after"><div class="af-t">退役之後</div>
        <p>${esc(G.afterlife)}</p></div>`:''}

      <div class="sec first"><h4>生涯場均</h4>
        <div class="big five">
          <div><div class="n">${s.pts}</div><div class="l">得分</div></div>
          <div><div class="n">${s.reb}</div><div class="l">籃板</div></div>
          <div><div class="n">${s.ast}</div><div class="l">助攻</div></div>
          <div><div class="n">${s.stl}</div><div class="l">抄截</div></div>
          <div><div class="n">${s.blk}</div><div class="l">阻攻</div></div>
        </div>
      </div>

      <div class="sec"><h4>生涯命中率</h4>
        <div class="big">
          <div><div class="n">${s.fg}<u>%</u></div><div class="l">投籃</div></div>
          <div><div class="n">${s.tp}<u>%</u></div><div class="l">三分</div></div>
          <div><div class="n">${s.ft}<u>%</u></div><div class="l">罰球</div></div>
          <div><div class="n">${s.gp}</div><div class="l">出賽場次</div></div>
        </div>
      </div>

      <div class="sec"><h4>生涯累計</h4>
        <div class="big">
          <div><div class="n">${s.totalPts.toLocaleString()}</div><div class="l">總得分</div></div>
          <div><div class="n">${s.totalReb.toLocaleString()}</div><div class="l">總籃板</div></div>
          <div><div class="n">${s.totalAst.toLocaleString()}</div><div class="l">總助攻</div></div>
          <div><div class="n">${s.money.toLocaleString()}</div><div class="l">生涯薪 (萬)</div></div>
        </div>
      </div>

      <div class="sec"><h4>榮譽</h4>
        <div class="honors">
          <div class="hcell${s.champs?' on':''}"><b>${s.champs}</b><span>總冠軍</span></div>
          <div class="hcell${mvpY.length?' on':''}"><b>${mvpY.length}</b><span>年度 MVP</span></div>
          <div class="hcell${fmvp?' on':''}"><b>${fmvp}</b><span>總冠軍賽 MVP</span></div>
          <div class="hcell${cnt('年度第一隊')?' on':''}"><b>${cnt('年度第一隊')}</b><span>年度第一隊</span></div>
        </div>
        ${mvpY.length?`<p class="hnote">年度 MVP 年份：${mvpY.map(a=>a.y+' ('+a.lg+')').join('、')}</p>`:''}
        ${Object.keys(otherAw).length?`<div class="tw" style="margin-top:7px">
          ${Object.keys(otherAw).map(k=>`<span class="chip">${esc(k)}${otherAw[k]>1?' ×'+otherAw[k]:''}</span>`).join('')}
        </div>`:''}
      </div>

      <div class="hof">
        <div class="v">${s.hof}<span>/100</span></div>
        <div class="l">名人堂票數　${s.hofIn
          ?'<b style="color:var(--accent)">入選 · 球衣退休</b>'
          :`差 ${70-s.hof} 票落選（門檻 70）`}</div>
      </div>

      ${peak?`<div class="sec"><h4>巔峰球季</h4>
        <div class="peak">
          <div class="pk-y">${peak.y}　${peak.age} 歲　${esc(peak.lg)} ${esc(peak.team)}</div>
          <div class="pk-s">
            <span><b>${peak.pts}</b>分</span><span><b>${peak.reb}</b>籃板</span><span><b>${peak.ast}</b>助攻</span>
            <span><b>${peak.stl}</b>抄截</span><span><b>${peak.blk}</b>阻攻</span>
          </div>
          <div class="pk-a">投籃 ${peak.fg}%　三分 ${peak.tp}%　罰球 ${peak.ft}%　單場最高 ${peak.hi} 分</div>
          <div class="pk-a">綜合 ${peak.ovr}　${esc(peak.rec)}${peak.awards.length?'　'+esc(peak.awards.join('、')):''}</div>
        </div>
      </div>`:''}

      <div class="sec"><h4>生涯紀錄</h4>
        <div class="honors">
          <div class="hcell${s.hiGame>=40?' on':''}"><b>${s.hiGame}</b><span>單場最高</span></div>
          <div class="hcell${s.bestPts>=20?' on':''}"><b>${s.bestPts}</b><span>單季最佳場均</span></div>
          <div class="hcell${s.bestStreak>=5?' on':''}"><b>${s.bestStreak}</b><span>最長連續全勤</span></div>
          <div class="hcell${s.starYears?' on':''}"><b>${s.starYears}</b><span>當家球星季數</span></div>
        </div>
        ${s.miles.length?`<div class="tw" style="margin-top:7px">
          ${s.miles.map(m=>`<span class="chip mile">🏅 ${esc(m)}</span>`).join('')}
        </div><p class="hnote">生涯達成 ${s.miles.length}／${MILESTONES.length} 個里程碑</p>`
        :`<p class="hnote">這趟生涯沒有達成任何里程碑（全部共 ${MILESTONES.length} 個）。</p>`}
      </div>

      <div class="sec"><h4>各階段足跡</h4>
        <div class="lgtab scroll-x"><table>
          <thead><tr><th>聯盟</th><th>年份</th><th>季</th><th>場均</th><th>主要定位</th><th>冠軍</th></tr></thead>
          <tbody>${byLg.map(e=>`<tr>
            <td class="lg">${esc(e.lg)}</td>
            <td class="dim">${e.y0}${e.y1!==e.y0?'–'+String(e.y1).slice(2):''}</td>
            <td>${e.seasons}</td>
            <td>${e.gp?`${r1(e.pts/e.gp)}/${r1(e.reb/e.gp)}/${r1(e.ast/e.gp)}`:'—'}</td>
            <td class="dim">${esc(ROLES[e.role]?ROLES[e.role].n:'—')}</td>
            <td>${e.champs||'—'}</td>
          </tr>`).join('')}</tbody>
        </table></div>
      </div>

      <div class="sec"><h4>身體帳單</h4>
        <div class="honors">
          <div class="hcell${injSevere?' bad':''}"><b>${injSevere}</b><span>重傷</span></div>
          <div class="hcell${injMinor?' bad':''}"><b>${injMinor}</b><span>小傷</span></div>
          <div class="hcell"><b>${S.filter(x=>x.miss).length}</b><span>報銷球季</span></div>
          <div class="hcell"><b>${G.teamsPlayed.length}</b><span>效力球隊</span></div>
        </div>
        <p class="hnote">天生體質「${esc(duraBand(G.dura).n)}」——${esc(duraBand(G.dura).d)}
          這是種子開局就決定的，不是你打壞的。</p>
      </div>

      ${goodT.length||badT.length?`<div class="sec"><h4>生涯特質 ${G.traits.length}／${Object.keys(TRAITS).length}</h4><div class="tw">
        ${goodT.map(t=>`<span class="chip trait" title="${esc(TRAITS[t].d)}">${esc(TRAITS[t].n)}</span>`).join('')}
        ${badT.map(t=>`<span class="chip down" title="${esc(TRAITS[t].d)}">${esc(TRAITS[t].n)}</span>`).join('')}
      </div><p class="hnote">點住特質可看解鎖條件</p></div>`:''}

      ${G.natl.length?`<div class="sec"><h4>中華隊 ${G.natl.length} 次徵召</h4>
        <div class="lgtab scroll-x"><table>
          <thead><tr><th>年份</th><th>賽事</th><th>你的打法</th><th>結果</th><th>海外曝光</th></tr></thead>
          <tbody>${G.natl.map(n=>`<tr>
            <td class="dim">${n.y}</td><td class="lg">${esc(n.c)}</td>
            <td>${esc(n.planName||'—')}</td>
            <td class="${n.big?'lg':'dim'}">${n.big?'打出代表作':'小組止步'}</td>
            <td class="dim">+${n.buzz!=null?n.buzz:'—'}</td>
          </tr>`).join('')}</tbody>
        </table></div>
        <p class="hnote">海外曝光累計 ${s.natlBuzz}，每 1 點讓每季被海外球隊相中的機率 +4.5%。</p>
      </div>`:''}

      <div class="sec"><h4>生涯逐年</h4>
        <div class="timeline">
          <div class="trow hd"><span class="y">年份</span><span class="w">球隊／事蹟</span><span class="s">得/籃/助</span></div>
          ${S.map(x=>`<div class="trow${x.champ?' champ':''}${x.miss?' miss':''}">
            <span class="y">${x.y} <u>${x.age}</u></span>
            <span class="w"><em>${esc(x.lg)}</em> ${esc(x.team)}${x.champ?' 🏆':''}${
              x.injury==='severe'?' <i class="tag-inj">重傷</i>':x.injury==='minor'?' <i class="tag-inj min">傷</i>':''}${
              x.awards.length?`<br><i class="tag-aw">${esc(x.awards.join('、'))}</i>`:''}</span>
            <span class="s">${x.miss?'<i>報銷</i>':`${x.pts}/${x.reb}/${x.ast}`}</span>
          </div>`).join('')}
        </div>
      </div>

      <div class="seedline">世界種子　<b>${esc(G.seed)}</b><br>相同種子＋相同選擇＝相同人生</div>
      <div class="btn-row">
        <button class="btn ghost" id="copyBtn">複製生涯摘要</button>
        <button class="btn" id="againBtn">再來一次</button>
      </div>
      <div class="btn-row">
        ${shareUrl()?'<button class="btn ghost" id="linkBtn">複製這局的連結</button>':''}
        <button class="btn ghost" id="sameSeedBtn">用同一顆種子重來</button>
      </div>
    </div>
  </div>`;

  $('#copyBtn').addEventListener('click',()=>{
    const txt=[
      `【籃球人生】${G.name}　${G.pos}／${STYLES[G.style].n}／${G.height}cm`,
      `評價 ${s.grade.g} — ${s.grade.t}　最高殿堂 ${topLg}`,
      `${S.length} 季　場均 ${s.pts} 分 ${s.reb} 籃板 ${s.ast} 助攻　單場最高 ${s.hiGame}`,
      `總冠軍 ${s.champs}　年度 MVP ${mvpY.length}　FMVP ${fmvp}　生涯薪 ${s.money.toLocaleString()} 萬`,
      s.hofIn?'名人堂入選 · 球衣退休':`名人堂票數 ${s.hof}／100（門檻 70）`,
      s.miles.length?`里程碑：${s.miles.join('、')}`:'',
      goodT.length?'特質：'+goodT.map(t=>TRAITS[t].n).join('、'):'',
      `種子 ${G.seed}`,
    ].filter(Boolean).join('\n');
    copyText(txt);
  });
  if($('#linkBtn')) $('#linkBtn').addEventListener('click',()=>{
    /* 網址在開始生涯時就已經同步好了，這裡只是讓使用者不必去點網址列 */
    copyText(shareUrl(),'已複製連結，貼給別人就是同一顆種子');
  });
  $('#againBtn').addEventListener('click',()=>{ G=null; clearUrl(); renderStart(); window.scrollTo(0,0); });
  $('#sameSeedBtn').addEventListener('click',()=>{
    const sd=G.seed,nm=G.name,ps=G.pos,st=G.style;
    G=createGame(sd,nm,ps,st);
    ALLOC={};INTENS='normal';ATT='steady';PANEL=null;
    render(); window.scrollTo(0,0);
  });
  window.scrollTo(0,0);
}

renderStart();
</script>
