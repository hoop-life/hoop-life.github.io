<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- 預設皮膚會跟著系統偏好走（preferredSkin()：淺色系統 → 木地板），
     所以外殼不可以寫死 dark：捲軸與手機網址列會跟畫面不同調。 -->
<meta name="color-scheme" content="dark light">
<meta name="description" content="台灣籃球人生模擬器：從 HBL 一路打到 NBA，或者停在某個你沒想過的地方。">
<meta name="theme-color" content="#12100D" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F0E5D2" media="(prefers-color-scheme: light)">
<meta name="version" content="1.7.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ctext%20y%3D%2252%22%20font-size%3D%2252%22%3E%F0%9F%8F%80%3C%2Ftext%3E%3C%2Fsvg%3E">
<style>
/* 最小 reset：artifact 主機本來會注入一份，單機版要自己帶 */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--ground,#12100D);color:var(--ink,#F2E9D8)}
img,svg{max-width:100%;height:auto}
button,input,select,textarea{font:inherit;color:inherit}
</style>
<title>HoopLife 籃球人生</title>

<style>
/* ============================================================
   HoopLife — 體育館電子計分板皮膚
   bare :root = 完整深色記分板調色盤（單一視覺世界，明確上底色）
   ============================================================ */
:root{
  --ground:#12100D;      /* 暖炭黑，色相偏琥珀 */
  --panel:#1C1913;
  --panel2:#241F17;
  --line:#332C21;
  --ink:#F2E9D8;
  /* --dim 是 45 處 9–12px 小字的顏色，--muted 是次級說明文字。
     兩個都要過 WCAG AA（小字 4.5:1），而且要對三種底色（ground/panel/panel2）都成立。
     舊值 --dim #6B6153 對 panel2 只有 2.70:1，木地板皮膚更低到 2.52:1。
     smoke.js 的樣式斷言會算層疊後的實際對比度，調色前先看那一段。 */
  --muted:#ADA392;
  --dim:#8F877C;
  --accent:#FFB020;      /* LED 琥珀 */
  --accent-soft:#FFB02022;
  --ball:#E8622C;        /* 球皮橘 */
  --good:#57C084;
  --warn:#E0A22B;
  --bad:#E2564A;
  --shadow:0 1px 0 #ffffff08, 0 10px 30px #00000055;
  --radius:3px;
  --fs-body:15px;

  --f-sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --f-head:var(--f-sans);
}
:root[data-skin="wood"]{
  --ground:#F0E5D2; --panel:#FBF5EA; --panel2:#F5EBDA; --line:#DBC9AC;
  --ink:#2A2118; --muted:#5B4D3A; --dim:#706451;
  --accent:#B5501C; --accent-soft:#B5501C18; --ball:#C9662A;
  --good:#2F7D51; --warn:#9A6A12; --bad:#B23A2E;
  --shadow:0 1px 0 #ffffffcc, 0 8px 22px #6d543018;
}
:root[data-skin="paper"]{
  --ground:#E9E6DD; --panel:#FCFBF7; --panel2:#F4F2EA; --line:#CBC5B6;
  --ink:#16150F; --muted:#544F43; --dim:#6A6659;
  --accent:#8C1F1F; --accent-soft:#8C1F1F14; --ball:#8C1F1F;
  --good:#2C6B45; --warn:#8A5E10; --bad:#8C1F1F;
  --shadow:none; --radius:0px;
  --f-head:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;
}
:root[data-fs="lg"]{ --fs-body:17px; }

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--f-sans);
  font-size:var(--fs-body);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  /* clip 不是 hidden：overflow-x:hidden 會讓 body 自己變成一個捲動容器，
     於是整頁多出第二條捲軸，window.scrollTo 捲的是外層、內容卻在內層——
     捲到哪裡都對不上。clip 只裁切、不生捲動容器。 */
  overflow-x:clip;
}
:root[data-skin="scoreboard"] body,:root:not([data-skin]) body{
  background-image:repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 3px);
}
button{font-family:inherit;font-size:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}

/* 外殼宣告了 viewport-fit=cover，意思是「版面延伸到安全區外，我自己用 env() 補回來」。
   沒補的話 iPhone 的瀏海與 home indicator 會壓到內容。 */
.wrap{max-width:560px;margin:0 auto;
  padding:0 calc(12px + env(safe-area-inset-right)) 120px calc(12px + env(safe-area-inset-left));}

/* ---------- 記分板狀態列 ---------- */
.board{
  position:sticky;top:0;z-index:40;
  /* 出血要連安全區一起吃掉：.wrap 的左右 padding 是 12px＋env()，
     只寫 -12px 的話 iPhone 橫向會在兩側留下 47px 沒被背景蓋到的縫，
     底下捲動的內容會從那道縫透出來。 */
  margin:0 calc(-12px - env(safe-area-inset-right)) 14px calc(-12px - env(safe-area-inset-left));
  padding:8px calc(12px + env(safe-area-inset-right)) 9px calc(12px + env(safe-area-inset-left));
  background:var(--panel);
  border-bottom:1px solid var(--line);
  box-shadow:var(--shadow);
}
.board-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.board-name{font-weight:800;letter-spacing:.02em;font-family:var(--f-head);}
.board-pos{
  font-family:var(--f-mono);font-size:.7em;font-weight:700;letter-spacing:.08em;
  padding:1px 6px;border:1px solid var(--accent);color:var(--accent);border-radius:var(--radius);
}
.board-team{color:var(--muted);font-size:.82em;margin-left:auto;text-align:right;}
.board-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  margin-top:8px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);
}
.cell{background:var(--panel2);padding:5px 7px;min-width:0;}
.cell .k{font-size:.62em;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;}
/* 「照最長的那一種算」：生涯薪破萬之後是 6 位數＋「萬」，320px 的格子只有 58.75px，
   1.05em 放不下（實測 16.6% 的渲染會折行或壓到隔壁格，7 位數更慘）。
   min-width:0 已經有了，但沒有 overflow:hidden，所以是兩格數字疊在一起而不是被切掉。 */
.cell .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700;
  font-size:1.05em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media (max-width:400px){ .cell .v{font-size:.92em;} }
:root[data-fs="lg"] .cell .v{font-size:.95em;}
.cell .v .u{font-size:.6em;color:var(--muted);font-weight:400;margin-left:1px;}
.v.hi{color:var(--accent);}

.loadbar{
  margin-top:7px;width:100%;display:block;text-align:left;padding:3px 0 0;
  background:none;border:0;cursor:pointer;
}
.loadbar .lb-top{display:flex;justify-content:space-between;font-size:.66em;letter-spacing:.1em;color:var(--dim);}
.loadbar .lb-top b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);letter-spacing:0;}
.loadbar:hover .lb-top,.loadbar:hover .lb-top b{color:var(--accent);}
.track{height:5px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:3px;}
.fill{height:100%;transition:width .5s ease;}
.tbtn.wide{width:100%;margin-top:7px;text-align:center;padding:5px;letter-spacing:.14em;}
.board-btns{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px;}
.board-btns .tbtn{width:100%;text-align:center;padding:5px 2px;letter-spacing:.08em;}
.board-sty{
  font-size:.66em;letter-spacing:.06em;color:var(--muted);
  padding:1px 5px;border:1px solid var(--line);border-radius:var(--radius);
}
.cell .v.rl{font-size:.86em;letter-spacing:.02em;}
.v.rl.star{color:var(--accent);} .v.rl.starter{color:var(--ink);}
.v.rl.rotation{color:var(--muted);} .v.rl.bench{color:var(--dim);}

/* 記分板展開面板 */
.panel{
  margin-top:8px;padding:9px;background:var(--panel2);
  border:1px solid var(--line);border-radius:var(--radius);
  animation:rise .22s ease both;
}
.panel .attrs{margin-bottom:7px;}
.phint{font-size:.74em;color:var(--muted);line-height:1.65;margin:7px 0 0;}
.phint b{color:var(--ink);}
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.ledger h5{
  margin:0 0 3px;font-family:var(--f-mono);font-size:.62em;letter-spacing:.14em;
  color:var(--dim);text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:2px;
}
.lrow{display:flex;justify-content:space-between;gap:5px;font-size:.7em;padding:1px 0;line-height:1.5;}
.lrow span{color:var(--muted);min-width:0;}
.lrow b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;flex:0 0 auto;}
.lrow b.up{color:var(--bad);} .lrow b.down{color:var(--good);}

/* 天生體質 */
.dura{
  display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-top:8px;
  padding:5px 8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
}
.dura .dl{font-family:var(--f-mono);font-size:.62em;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;}
.dura b{font-weight:800;font-size:.9em;}
.dura .dv{font-family:var(--f-mono);font-size:.68em;color:var(--muted);margin-left:auto;
  font-variant-numeric:tabular-nums;white-space:nowrap;}
.dura.iron b,.dura.solid b{color:var(--good);}
.dura.normal b{color:var(--muted);}
.dura.thin b,.dura.paper b{color:var(--bad);}
.dura.iron,.dura.solid{border-color:color-mix(in srgb,var(--good) 40%,var(--line));}
.dura.thin,.dura.paper{border-color:color-mix(in srgb,var(--bad) 40%,var(--line));}

/* 球探報告：同儕定位 + 下一道門檻 */
.peer{padding:2px 0 1px;}
.peer .pr-t{font-family:var(--f-mono);font-size:.62em;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;}
.peer .pr-v{font-size:.86em;color:var(--muted);font-variant-numeric:tabular-nums;}
.peer .pr-v b{color:var(--accent);font-weight:800;}
.peer .pr-v i{font-style:normal;font-size:.86em;color:var(--dim);}
h5.sch{
  margin:11px 0 5px;font-family:var(--f-mono);font-size:.62em;letter-spacing:.14em;
  color:var(--dim);text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:2px;
}
.gate{
  border:1px solid var(--line);border-left:2px solid var(--muted);border-radius:var(--radius);
  padding:6px 8px;margin-bottom:6px;background:var(--panel);
}
.gate.ok{border-left-color:var(--good);}
.gate.off{border-left-color:var(--dim);opacity:.72;}
.gate .gt{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap;}
.gate .gt b{font-size:.88em;font-weight:800;}
.gk{font-family:var(--f-mono);font-size:.6em;letter-spacing:.1em;color:var(--dim);
  border:1px solid var(--line);border-radius:var(--radius);padding:0 4px;flex:0 0 auto;}
.gk.on{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--line));}
.gk.off{color:var(--dim);}
.greq{display:flex;justify-content:space-between;gap:6px;font-family:var(--f-mono);
  font-size:.7em;font-variant-numeric:tabular-nums;padding:1px 0;}
.greq span{color:var(--dim);}
.greq b.up{color:var(--good);} .greq b.down{color:var(--warn);}
.gate .gn{font-size:.7em;color:var(--muted);margin:3px 0 0;line-height:1.55;}

/* 海外路線圖：七個目的地一次看完 */
.omap{display:flex;flex-direction:column;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.orow{display:flex;align-items:baseline;gap:5px;background:var(--panel);padding:4px 7px;flex-wrap:wrap;}
.orow .on{font-size:.8em;font-weight:700;flex:1 1 7em;min-width:0;}
.orow .ov{font-family:var(--f-mono);font-size:.66em;font-variant-numeric:tabular-nums;
  color:var(--muted);white-space:nowrap;flex:0 0 auto;}
.orow .os{font-family:var(--f-mono);font-size:.58em;letter-spacing:.06em;white-space:nowrap;flex:0 0 auto;
  border:1px solid var(--line);border-radius:var(--radius);padding:0 4px;color:var(--dim);}
.orow .od{font-size:.62em;color:var(--dim);flex:1 0 100%;line-height:1.4;}
.orow.been .on{color:var(--good);} .orow.been .os{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--line));}
.orow.open .on{color:var(--accent);} .orow.open .os{color:var(--accent);border-color:var(--accent);}
.orow.short .os{color:var(--warn);}
.orow.locked{opacity:.6;} .orow.later{opacity:.75;}

/* 成功率粗略帶。注意：真正的顏色規則寫在 .opt .odds 之後（見「成功率粗略帶的顏色」），
   放在這裡的話會被 122 行外那條 .opt .odds{color:var(--dim)} 整組蓋掉——
   選擇器一樣重（都是兩個 class）的時候，後面出現的那條贏。 */
.bd-good{color:var(--good);} .bd-mid{color:var(--muted);}
.bd-warn{color:var(--warn);} .bd-bad{color:var(--bad);}
.opt .odds{border:1px solid currentColor;border-radius:var(--radius);padding:0 4px;font-weight:700;}

/* 季初分段：訓練強度／球季態度 */
.seclab{
  font-family:var(--f-mono);font-size:.64em;letter-spacing:.14em;color:var(--dim);
  text-transform:uppercase;margin:0 0 5px;
}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.segbtn{
  padding:6px 3px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);
  cursor:pointer;text-align:center;transition:all .15s;line-height:1.3;
}
.segbtn b{display:block;font-size:.84em;font-weight:700;}
.segbtn span{
  display:block;font-family:var(--f-mono);font-size:.6em;color:var(--dim);
  font-variant-numeric:tabular-nums;
}
.segbtn[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--panel2);}
.segbtn[aria-pressed="true"] b{color:var(--accent);}
.segdesc{font-size:.78em;color:var(--muted);margin:0 0 8px;line-height:1.55;min-height:2.4em;}

/* 即時風險條 */
.risk{
  background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);
  padding:7px 8px;margin-bottom:9px;
}
.risk-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;}
.risk-k{font-family:var(--f-mono);font-size:.62em;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;}
.risk-v{font-family:var(--f-mono);font-size:.78em;font-variant-numeric:tabular-nums;color:var(--muted);}
.risk-v b{color:var(--ink);font-weight:800;}
.risk-v i{font-style:normal;color:var(--dim);font-size:.9em;}
.risk .track{margin-top:4px;}

/* ---------- 敘事卡 ---------- */
.log{display:flex;flex-direction:column;gap:10px;}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 13px;box-shadow:var(--shadow);
}
/* 進場動畫只給新卡。掛在 .card 上的話，#log 每次重建就是 7 張一起重播。 */
.card.new{animation:rise .32s ease both;}
@keyframes rise{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
.card .eyebrow{
  font-family:var(--f-mono);font-size:.66em;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);display:flex;gap:8px;align-items:center;margin-bottom:5px;
}
.card .eyebrow b{color:var(--accent);letter-spacing:.16em;}
.card h3{margin:0 0 5px;font-size:1.02em;font-family:var(--f-head);font-weight:800;text-wrap:balance;letter-spacing:.01em;}
.card p{margin:0 0 6px;}
.card p:last-child{margin-bottom:0;}
.card.hl{border-color:var(--accent);background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--panel);}
.card.bad{border-color:var(--bad);}
.card.good{border-color:var(--good);}

.stat-line{
  font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.9em;
  display:flex;flex-wrap:wrap;gap:0 14px;color:var(--muted);margin-top:6px;
  padding-top:6px;border-top:1px dashed var(--line);
}
.stat-line b{color:var(--ink);font-weight:700;}
.delta{font-family:var(--f-mono);font-size:.85em;display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:7px;}
.chip{
  padding:1px 6px;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--panel2);font-variant-numeric:tabular-nums;white-space:nowrap;
  max-width:100%;min-width:0;
}
/* 特質 chip 是 <button>（title 在手機上叫不出來，所以要真的能點）——
   但外觀要跟其他 chip 一模一樣，不要長得像按鈕。 */
button.chip{font:inherit;line-height:inherit;cursor:pointer;}
/* 內容是一整句話的 chip（傷勢、歲月、天賦上限說明）必須換行。
   nowrap ＋ flex item 的 min-width:auto 會讓它整條衝出卡片，
   再被 body 的 overflow-x:hidden 切掉——字就這樣不見了。實測衝出畫面 350px。 */
.chip.long{white-space:normal;overflow-wrap:anywhere;}
.chip.up{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,var(--line));}
.chip.down{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line));}
.chip.trait{color:var(--accent);border-color:var(--accent);font-weight:700;}
.chip .capnote{font-style:normal;font-size:.82em;color:var(--dim);margin-left:2px;}
.chip.mile{color:var(--accent);border-color:var(--accent);font-weight:700;
  background:var(--accent-soft);}
.chip.rl-star{color:var(--accent);border-color:var(--accent);}
.chip.rl-bench{color:var(--dim);}
/* 同儕定位（季末結算） */
.peerline{
  margin-top:7px;padding:4px 8px;font-family:var(--f-mono);font-size:.74em;
  font-variant-numeric:tabular-nums;color:var(--muted);
  border-left:2px solid var(--accent);background:var(--panel2);border-radius:var(--radius);
}
.peerline b{color:var(--ink);font-weight:800;}
.peerline em{font-style:normal;color:var(--accent);font-weight:700;margin-left:6px;}

/* ---------- 動作面板 ---------- */
.dock{
  position:sticky;bottom:0;z-index:30;
  margin:14px calc(-12px - env(safe-area-inset-right)) 0 calc(-12px - env(safe-area-inset-left));
  padding:11px calc(12px + env(safe-area-inset-right)) 14px calc(12px + env(safe-area-inset-left));
  /* home indicator 的安全區是 34px，而這裡的下 padding 只有 14px——
     「進入下一年」「完成訓練」這些最常按的按鈕下緣會落進系統手勢帶。 */
  padding-bottom:calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--ground) 18px);
}
/* 面板比視窗高的時候一定要退回 static。
   sticky ＋ bottom:0 的意思是「把下緣拉到視窗底部」——面板只要比視窗高，
   上緣就會被推到畫面外，而且怎麼捲都追不回來（它跟著視窗跑）。
   季初加練的面板 1180px，任何手機都比它矮，於是最上面的加練骰子與訓練強度
   永遠看不到。這就是「骰子不見了」。fitDock() 每次 render 後量一次。 */
.dock.tall{position:static;}
.dock-in{

/* 成功率粗略帶的顏色：一定要排在上面那條之後、而且一樣重（兩個 class），

   smoke.js 的樣式斷言就是在守這件事。 */
.odds.bd-good{color:var(--good);} .odds.bd-mid{color:var(--muted);}
.odds.bd-warn{color:var(--warn);} .odds.bd-bad{color:var(--bad);}

.btn{

}

  line-height:1.15;display:block;
}

.shot.swish{border-color:var(--accent);}

.shot.rim{opacity:.7;}
.shot.air{opacity:.7;}
.shot.air .v{color:var(--bad);}
.shot.hot::after{

  box-shadow:0 0 0 1px var(--ball),0 0 9px -1px var(--ball);
}

<!-- 讀屏的播報區。**一定要放在 #app 外面**：render() 每次都是整段 app.innerHTML=…，
     掛在裡面的 aria-live 節點每次都是「剛被插入的新節點」，而 live region 要先存在、
     內容後變才會被念出來——掛在 #app 裡面等於沒有作用。這裡放一個常駐的節點，
     render() 只改它的文字。 -->
<div id="sr" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<!-- role="status" 才會被讀屏念出來；少了它，「已複製連結」對讀屏使用者等於沒發生 -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="engine">
/* 版本號的單一來源。package.json、版本紀錄.md 的最新一節、以及成品 index.html
   的 <meta name="version"> 全部對這一個——以前 package.json 停在 1.0.0、
   版本紀錄已經到 v1.4.1、成品裡完全沒有版本字串，出了問題連是哪一版都問不出來。 */
const VERSION='1.7.0';
/* =====================================================================
   HoopLife 引擎（純邏輯，無 DOM）
   相同種子 ＋ 相同選擇 ＝ 相同人生：
   所有影響狀態的亂數一律經由 g._rng，且呼叫順序固定。

/* ---------- 決定性亂數 ---------- */
/* 名字是 cyrb32 不是 cyrb128：原版的 cyrb128 回傳四個 32 位元，這裡最後一行把四個
   XOR 折成一個 32 位元。**這是刻意的取捨，不是 bug，不要「修好」它**——
   makeSeed 用 32 字元字母表產 8 碼＝2^40 種種子，全部映射到 2^32 個世界，
   所以「不同種子開出同一段人生」是會發生的（實測連續 200 萬顆 8 字元種子碰撞 436 次，
   生日期望 465.7；例如 hxjbaaaa 與 tfmdaaaa 完全同一段人生）。
   核心承諾「同一顆種子＝同一段人生」沒有被破壞，破的是它的逆命題。
   要把它改回四個 32 位元＋sfc32，代價是**所有公布過的種子當場全部失效**
   （audit ⑤的開局指紋會轉紅，README 的種子表變廢紙），為 2^32 的世界空間不值得。
   詳見 開發指南.md 的「已知限制」。 */
function cyrb32(str){
  let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;
  for(let i=0;i<str.length;i++){
    const k=str.charCodeAt(i);
    h1=h2^Math.imul(h1^k,597399067); h2=h3^Math.imul(h2^k,2869860233);
    h3=h4^Math.imul(h3^k,951274213); h4=h1^Math.imul(h4^k,2716044179);
  }
  h1=Math.imul(h3^(h1>>>18),597399067); h2=Math.imul(h4^(h2>>>22),2869860233);
  h3=Math.imul(h1^(h3>>>17),951274213); h4=Math.imul(h2^(h4>>>19),2716044179);
  return (h1^h2^h3^h4)>>>0;
}
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function makeSeed(rndFn){
  const cs='abcdefghijkmnpqrstuvwxyz23456789';
  let s=''; for(let i=0;i<8;i++) s+=cs[Math.floor(rndFn()*cs.length)];
  return s;
}

/* 位置補正的門檻。
   綜合是加權平均，而訓練是遞減報酬——權重越集中的位置（中鋒 reb .24＋def .22）
   越容易把點數整包倒進高權重項，同樣的訓練量換到的綜合就越高。
   高中畢業當下實測（全程全力以赴＋貪婪分配，1000 局）：
     綜合 p90　中鋒 67 ／ 得分後衛 65 ／ 控球 64 ／ 大前 62 ／ 小前鋒 60
   所以「綜合 64」這種單一數字的門檻等於把鋒線判出局——實測跨過 NCAA 門檻的比率
   中鋒 38.3%、小前鋒 1.1%，而 POS.SF 的說明還寫著「旅外市場最吃這一味」。
   這裡用權重的 L2 範數（＝集中度）把門檻拉平；係數 122 是照上面那組 p90 量出來的斜率，
   不是猜的。大學畢業之後天賦上限開始綁住成長，五個位置的 p90 只差 1 分，
   所以補正只用在高中階段的門檻，後面的門檻本來就公平。 */
function posConc(pos){
  const w=POS[pos].w; let s=0;
  for(const k in w) s+=w[k]*w[k];
  return Math.sqrt(s);
}
const POS_KEYS=Object.keys(POS);
const POS_CONC_MEAN=POS_KEYS.reduce((s,k)=>s+posConc(k),0)/POS_KEYS.length;
const POS_GATE_K=122;
/* 門檻要跟 POS_OVR_ADJ 同步位移：綜合被加了 N，門檻不加同一個 N 就是補了兩次
   （實測不同步時走過 NCAA 由 6.67% 變 17.26%，而控球從 10.50% 掉到 5.24%，
   `數值設定.md` 那張「補正後達標率 4~10%」的表整張作廢）。 */
function posGate(pos,base){
  return Math.round(base+(posConc(pos)-POS_CONC_MEAN)*POS_GATE_K)+POS_OVR_ADJ[pos];
}

/* 單項屬性的門檻也要補正，理由一樣：同一個「球商 55」對控球是免費的
   （權重 .15，貪婪分配本來就會一直往那裡倒），對鋒衛則要拿綜合去換。

   補正之後 NCAA 的達標率從 控球11%／中鋒26%／小前鋒1% 變成 4%～10%。 */
const ATTR_GATE_K=343;
function posAttrGate(pos,k,base){
  const mean=POS_KEYS.reduce((s,p)=>s+(POS[p].w[k]||0),0)/POS_KEYS.length;
  return Math.round(base+((POS[pos].w[k]||0)-mean)*ATTR_GATE_K);
}

  {k:'asiaq',n:'亞洲盃資格賽', w:3,need:71,fame:13,buzz:1.0,d:'亞洲區的門票戰，日韓菲都在。'},

  {k:'wcq',  n:'世界盃資格賽', w:2,need:77,fame:21,buzz:1.9,d:'世界舞台的入場券，對手是歐美勁旅。'},

/* 國際賽的三種打法：各看不同屬性，成功了給的東西也不一樣。
   `gain` 是成功時的曝光與名氣倍率——風險越高，成功的回報要越大。
   以前三種打法**成功的報酬完全一樣、只有成功率不同**，於是「扛下來」是期望值上
   永遠不值得選的那一個：實測 9,321 張徵召卡的平均成功率 carry 0.494／
   orchestrate 0.602／lockdown 0.648，而屬性獎勵換算成綜合是
   carry +0.198／orch +0.297／lockdown +0.388（心理在五個位置的權重都是九項裡最低）——
   兩條腿都是短的。決定性的死選項檢定：125,000 局配對，
   「選單裡把 carry 拿掉」比「照成功率挑最高的」還好 +2.5 CI ——
   把它整個從遊戲裡刪掉，玩家一分錢都沒損失。
   倍率只乘在**成功**那一邊：失敗也乘的話，carry 砸了反而拿到比別人多的曝光。 */
const NATL_PLANS=[
  {k:'carry',n:'扛下來，球給我', kind:'push',gain:1.5,
   d:'關鍵球自己處理。成了就是全國轉播的代表作，砸了就是罵聲。',
   p:g=>clamp((g.a.shoot*0.4+g.a.mind*0.35+g.a.three*0.25-52)/40,0.12,0.80)},
  {k:'orchestrate',n:'打體系，串連全隊',kind:'norm',gain:1.0,
   d:'把球導出去，讓中華隊像一支球隊。穩，但鏡頭不會只給你。',
   p:g=>clamp((g.a.pass*0.45+g.a.iq*0.40+g.a.handle*0.15-46)/38,0.18,0.86)},
  {k:'lockdown',n:'守下對方王牌',kind:'safe',gain:0.85,
   d:'把最硬的活扛下來。教練與球探最愛，但數據不會漂亮。',
   p:g=>clamp((g.a.def*0.45+g.a.ath*0.35+g.a.reb*0.20-45)/38,0.18,0.86)},
];
/* 三個查表一律 fail loud。查不到代表資料表本身寫錯，不是正常狀態——
   靜默退回預設值會讓「賽事改名」變成「名人堂票數少了兩分」這種查不出來的 bug。
   這些分支今天一條都到不了（鍵都是同一次執行內程式自己寫進去的），所以行為完全不變。 */
function natlComp(k){
  const c=NATL_COMPS.find(x=>x.k===k);
  if(!c) throw new Error('未知的國際賽事：'+k);
  return c;
}
function natlPlan(k){
  const p=NATL_PLANS.find(x=>x.k===k);
  if(!p) throw new Error('未知的國際賽打法：'+k);
  return p;
}
function gradTryout(lg){
  const t=GRAD_TRYOUTS.find(x=>x.lg===lg);
  if(!t) throw new Error('未知的畢業試訓目的地：'+lg);
  return t;
}

/* ---------- 里程碑：長生涯的追逐目標 ---------- */
/* 一律只算職業球季（第二個參數 P 就是 proStats 的結果）。
   舊版讀的是 g.career，而 g.career 含高中大學——高中生在 HBL 砍場均 25 分就解鎖
   「單季場均 25 分」，大學打完就先拿到「生涯 1,000 分」，然後這些里程碑再回頭
   加名人堂票數。養成期的數字不該當成職業生涯的成就。 */
const MILESTONES=[
  {k:'pts1k', n:'職業 1,000 分',  v:2, f:(g,P)=>P.totalPts>=1000},
  {k:'pts5k', n:'職業 5,000 分',  v:3, f:(g,P)=>P.totalPts>=5000},
  {k:'pts10k',n:'職業 10,000 分', v:5, f:(g,P)=>P.totalPts>=10000},
  {k:'pts20k',n:'職業 20,000 分', v:8, f:(g,P)=>P.totalPts>=20000},
  {k:'reb3k', n:'職業 3,000 籃板', v:3, f:(g,P)=>P.totalReb>=3000},
  {k:'ast3k', n:'職業 3,000 助攻', v:3, f:(g,P)=>P.totalAst>=3000},
  {k:'gp500', n:'職業 500 場',    v:2, f:(g,P)=>P.gp>=500},
  {k:'gp1000',n:'職業 1,000 場',  v:4, f:(g,P)=>P.gp>=1000},
  {k:'hi40',  n:'職業單場 40 分',  v:2, f:(g,P)=>P.hi>=40},
  {k:'hi50',  n:'職業單場 50 分',  v:4, f:(g,P)=>P.hi>=50},
  {k:'hi60',  n:'職業單場 60 分',  v:7, f:(g,P)=>P.hi>=60},
  /* 用 proStreak 不是 streakFull：streakFull 含高中大學，實測 6,000 局裡有 380 局
     完全沒打過職業，其中 200 局（53%）靠學生時期拿到這枚里程碑——結算頁一邊寫
     「沒能走到職業」一邊掛著金牌，而且還回頭加了名人堂票數。 */
  {k:'iron5', n:'職業連續 5 季全勤', v:2, f:g=>g.proStreak>=5},
  /* 原本是「場均 15/8/8」，實測 31,850 個球季達成 0 次——位置權重讓籃板與助攻互斥
     （控衛的單季籃板天花板 5.4、中鋒的助攻天花板 3.6），只有小前鋒兩邊都沾得上邊，
     而小前鋒的天花板是 9.7 板／6.1 助（實測最接近的一季是組織核心小前鋒的 37.7/7.9/6.1）。
     15-7-6 當時量到 0.7%，但 v1.6.0 換掉名單線與位置補正之後掉到 **0.23%**（2,191 人裡 5 人）
     ——⑪B 那條「沒有死內容」的守門只有 ~500 個樣本，等於在擲一枚硬幣，
     v1.6.0 是靠那組種子剛好撞到才全綠的（假綠）。助攻退一格到 5，實測 1.78%：
     一樣是全聯盟數得出來的球季，但守門不再靠運氣。 */
  {k:'tri',   n:'職業單季 15-7-5', v:5, f:g=>{const s=g.seasons[g.seasons.length-1];
              return !!s&&isProSeason(s)&&s.gp>0&&s.pts>=15&&s.reb>=7&&s.ast>=5;}},
  {k:'ace',   n:'職業單季場均 25 分',v:4, f:g=>{const s=g.seasons[g.seasons.length-1];
              return !!s&&isProSeason(s)&&s.gp>0&&s.pts>=25;}},
];

/* ---------- 小工具 ---------- */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const r1=v=>Math.round(v*10)/10;
function pick(rng,arr){ return arr[Math.floor(rng()*arr.length)]; }
function ri(rng,a,b){ return a+Math.floor(rng()*(b-a+1)); }
/* 標準常態累積機率（Abramowitz–Stegun 近似）——換算同儕排名用，純函式 */
function normCdf(z){
  const t=1/(1+0.2316419*Math.abs(z));
  const d=0.3989422804014327*Math.exp(-z*z/2);
  let p=d*t*(0.31938153+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return z>0?1-p:p;
}
/* 同儕定位：你在這個聯盟裡排第幾 */
function peerRank(g,ovr){
  const L=LEAGUES[g.league];
  const above=clamp(1-normCdf((ovr-L.bar)/L.sd),0.0002,0.9998);
  const rank=clamp(Math.round(above*L.size)+1,1,L.size);
  const pct=rank/L.size;
  const tier=pct<=0.02?'聯盟頂尖':pct<=0.10?'明星等級':pct<=0.30?'穩定先發'
            :pct<=0.62?'輪替戰力':'邊緣人';
  return {rank:rank,size:L.size,pct:pct,tier:tier,lg:L.n,short:L.short};
}
/* 成功率粗略帶：讓玩家知道自己在賭什麼，但不給到小數點 */
function oddsBand(p){
  if(p>=0.85) return {n:'幾乎穩了',k:'good'};
  if(p>=0.62) return {n:'很有把握',k:'good'};
  if(p>=0.42) return {n:'五五波',  k:'mid'};
  if(p>=0.22) return {n:'賭一把',  k:'warn'};
  if(p>=0.08) return {n:'機會渺茫',k:'bad'};
  return {n:'幾乎不可能',k:'bad'};
}

/* 位置的綜合補正。
   綜合是加權平均而訓練是遞減報酬，所以權重越集中的位置（中鋒 reb .24＋def .22）
   越容易把點數整包倒進高權重項——同樣的訓練量換到的綜合就越高。
   `posGate` 已經替這件事補過**門檻**，但補的只有門檻：實測（配對種子、六球風輪流、
   每位置 1,500 局）小前鋒的生涯指數中位數 6,982，控球 8,991；名人堂率 2.73% vs 11.73%；
   歷史 75 大 0.53% vs 4.47%（**8.4 倍**）。而小前鋒是開場的預設位置，
   等於 `CI_PCTL`／`LEGEND_IN` 對「多數人實際開的那一局」是失準的。
   30 格（位置×球風）全掃時，小前鋒那一列 30 格全部墊底——換球風救不回來。

   修法是在 overall／potOvr 的**回傳值**上加一個常數，而不是去改 POS 的權重：
   改權重會透過 posConc 把小前鋒自己的高中門檻**抬高**（實測走過 NCAA 6.67%→2.17%，
   方向剛好反了），而且 `audit` 的開局指紋雜湊的是 g.a／g.pot 的九項裸值——
   改權重會讓五顆公布種子的指紋全部位移，加在回傳值上則一格都不動。
   門檻必須同步位移（posGate 也加同一個常數），不然等於補兩次。 */
/* 掃出來的：六球風全跑、每格 3,600 局，五位置的名人堂率
   7.25／5.39／6.72／7.08／7.50（離散 **1.39 倍**，舊制 6.8 倍）、
   歷史 75 大 1.86／1.50／1.83／1.78／1.58（離散 **1.24 倍**，舊制 5.75 倍）、
   生涯指數中位數離散 1.059 倍。整數化的綜合讓 ±1 就會推動一整批人跨過門檻，
   所以再往下磨的邊際效益很低。 */
const POS_OVR_ADJ={PG:0,SG:0,SF:3,PF:1,C:0};
function overall(g){
  return clamp(rawOvr(g)+POS_OVR_ADJ[g.pos],0,99);
}
/* 補正前的加權平均。要拿某一項屬性跟「這組屬性的平均水準」比的時候用它，不要用 overall——
   POS_OVR_ADJ 是加在回傳值上的位置補正，不扣掉的話同樣一組屬性在小前鋒身上會被算成
   「防守比平均低 3」、在控球身上「高 1」，補正就在它本來要抹平的那條軸上製造新的偏差。
   v1.7.0 之前這裡是 `overall(g)-POS_OVR_ADJ`，而 overall 又是由它推出來的——
   overall 一旦夾在 99，反推回來的「補正前平均」就會少 3。現在是它算 overall，不是反過來。 */
function rawOvr(g){
  const w=POS[g.pos].w; let s=0;
  for(const k in w) s+=g.a[k]*w[k];
  return Math.round(s);
}
/* 天花板綜合：每一項都練到天賦上限之後會是多少。19 歲的球員還沒打出來，
   NBA 球隊看的是這個數字，不是現值。 */
/* 夾 0~99 跟 overall 同一個理由：POS_OVR_ADJ 是加在**四捨五入之後**的，
   小前鋒 +3 會讓天花板算出 100~102，而那個數字會直接印在球探報告與選秀宣告卡上
   （「天花板 102」——遊戲裡沒有 102 這種刻度）。實測 24 萬組有 0.28% 越界，最大 102。 */
function potOvr(g){
  const w=POS[g.pos].w; let s=0;
  for(const k in w) s+=(g.pot[k]==null?99:g.pot[k])*w[k];
  return clamp(Math.round(s)+POS_OVR_ADJ[g.pos],0,99);
}
/* 球探評價：現值與天花板的加權。年級越低，球隊越只能賭天花板。
   NBA 選秀（大一到大四）都用這一個數字，所以「早走」與「讀完」是同一把尺量的。 */
function nbaScout(g,ovr){
  const y=clamp(Math.round(g.stageYear),1,4);
  const wPot=[0,0.55,0.45,0.35,0.25][y];
  return Math.round((ovr*(1-wPot)+potOvr(g)*wPot)*10)/10;
}
const NBA_SCOUT_GATE=78;   /* 低於這個數字，NBA 選秀的選項根本不會出現 */
/* 屬性加減的唯一入口：往上一律夾在天賦上限（要突破天花板得靠 res.pot 加上限），
   往下才允許掉到 10 以下的地板。畫面上畫了刻度，就不能有任何路徑越過它。 */
function bumpAttr(g,k,v){
  const cap=g.pot[k]==null?99:g.pot[k];
  const hi=v>0?Math.max(cap,g.a[k]):99;
  const before=g.a[k];
  g.a[k]=clamp(Math.round((g.a[k]+v)*10)/10,0,hi);
  return Math.round((g.a[k]-before)*10)/10;   /* 回傳「實際吃進去多少」，不是名目值 */
}
function trait(g,k){ return g.traits.indexOf(k)>=0; }
function addTrait(g,k){
  if(trait(g,k)) return false;
  g.traits.push(k); g._newTraits.push(k); return true;
}

/* ---------- 建立新生涯 ---------- */
function createGame(seedStr,name,pos,style){
  const rng=mulberry32(cyrb32('hooplife|'+seedStr));
  const sty=STYLES[style]?style:'allround';
  const g={
    seed:seedStr,_rng:rng,
    name:name,pos:pos,style:sty,
    height:ri(rng,POS[pos].h[0],POS[pos].h[1]),
    /* 天生體質：受傷這件事不該完全是選擇的結果，也要有「這局抽到什麼身體」 */
    dura:ri(rng,0,100),
    age:16,year:2026,
    stage:'hs',stageYear:1,
    league:'hbl',team:'',role:'starter',fit:'ok',
    a:{},pot:{},
    load:6,fame:8,money:0,natlBuzz:0,
    seasons:[],career:{gp:0,pts:0,reb:0,ast:0,stl:0,blk:0,fg:0,tp:0,ft:0,seasons:0,hiGame:0},
    awards:[],traits:[],natl:[],milestones:[],
    champs:0,proChamps:0,teamsPlayed:[],teamSwitches:0,injuries:0,streakFull:0,bestStreak:0,
    /* 職業口徑的連續全勤：里程碑與履歷用這個，streakFull 含高中大學 */
    proStreak:0,bestProStreak:0,
    sameTeamYears:0,starYears:0,benchYears:0,sameTeamStar:0,
    bestOvr:0,preInjuryOvr:0,gutsyHS:0,egoCount:0,swishes:0,
    evSeen:{},                                /* 事件看過幾次（evWeight 的重複衰減用） */
    phase:'train',pending:null,log:[],attitude:'steady',
    _newTraits:[],_newMiles:[],flags:{},retiredWhy:'',
  };
  /* 起始屬性：位置傾向 + 球風加成 + 個體差 */
  const w=POS[pos].w,ST=STYLES[sty];
  for(const at of ATTRS){
    const bias=(w[at.k]||0)*100;              /* 0~24 */
    /* 上限放到 56，否則球風加成會被夾掉——加了卻沒效果比不加更糟 */
    g.a[at.k]=clamp(Math.round(21+bias*1.0+(ST.start[at.k]||0)+ri(rng,-5,8)),8,56);
  }
  /* 潛力上限：整體天賦 + 球風專長 + 每項浮動 */
  const talent=ri(rng,0,100);
  /* talentBand 只有 audit ⑤的種子指紋在讀（引擎自己不用它做任何判斷）。
     它是那道守門的輸入之一，不是死碼——刪了 audit 會抓不到天賦帶的位移。 */
  g.talentBand=talent;
  const base=58+Math.round(talent*0.36);      /* 58~94 */
  for(const at of ATTRS){
    g.pot[at.k]=clamp(base+ri(rng,-14,15)+Math.round((w[at.k]||0)*30)+(ST.cap[at.k]||0),35,99);
    /* 起始值與天賦上限是兩串獨立的擲骰（起始夾 8~56、上限夾 35~99），
       所以「開局就已經超過自己的天花板」是抽得出來的：實測 0.04% 的人生至少一項越界，
       畫面上的游標會越過刻度，而 bumpAttr 的 hi=max(cap,a) 會讓它就地卡死練不動。
       這裡把上限抬到現值（不是把現值砍下去）：你已經做得到的事，那就是你的下限天花板。
       **這一行不動任何 rng**——擲骰次數指紋不會變，只有數值指紋會位移。 */
    if(g.pot[at.k]<g.a[at.k]) g.pot[at.k]=g.a[at.k];
  }
  if(g.dura>=TG.rubberDura) addTrait(g,'rubber');
  if(g.dura<=TG.brittleDura) addTrait(g,'brittle');
  g._newTraits=[];                            /* 天生特質不當成「本季獲得」跳出來 */
  g.team=pick(rng,HS_TEAMS);
  g.teamsPlayed.push(g.team);
  g.bestOvr=overall(g);
  g.role=roleOf(g,overall(g));
  g.log.push({kind:'open',title:'高一春天',
    body:`${g.name}，${g.height} 公分，${POS[pos].n}／${ST.n}。進了 ${g.team} 籃球隊，`+
         `球衣號碼還沒發下來，先從撿球開始。\n\n`+
         `${duraBand(g.dura).open}`});
  startTrain(g);
  return g;
}
/* 體質分帶：玩家看得到自己抽到什麼身體，但看到的是描述不是裸數字 */
function duraBand(v){
  if(v>=88) return {k:'iron',  n:'鐵打的',  d:'怎麼撞都沒事的那種人。',
    open:'體檢報告上，隊醫多看了兩眼：這副身體是鐵打的。'};
  if(v>=68) return {k:'solid', n:'硬朗',    d:'比一般人耐撞一點。',
    open:'隊醫說你的關節條件不錯，該練就放心練。'};
  if(v>=33) return {k:'normal',n:'普通',    d:'跟大多數人一樣，該保養還是要保養。',
    open:'體檢一切正常，沒有特別好也沒有特別壞。'};
  if(v>=13) return {k:'thin',  n:'偏脆',    d:'比一般人容易出狀況。',
    open:'隊醫皺了眉：你的腳踝比同年紀的人鬆，這種身體不能硬拚。'};
  return {k:'paper',n:'紙糊的',d:'一撞就倒，一倒就是好幾週。',
    open:'隊醫沉默了很久才說：你這副身體，要用一輩子的方式去打球。'};
}
/* 體質對受傷率的倍率。用乘法不用加法：加法只是一筆固定稅，拚不拚都繳一樣多，
   於是「紙糊的身體不能硬拚」這件事根本不成立。乘法才會讓體質與選擇互相放大。 */
function duraMult(g){
  const d=g.dura==null?50:g.dura;
  return Math.round(clamp(1+(50-d)/50*0.8,0.45,1.8)*1000)/1000;
}
function duraLoad(g){ return Math.round((50-(g.dura==null?50:g.dura))/50*2); }
/* 體質也影響「受傷會不會變成重傷」。只影響次數不影響嚴重度的話，
   紙糊的人只是比較常扭到腳，跟鐵人一樣不容易斷韌帶——那不叫紙糊。 */
function duraSevere(g){ return clamp(1+(duraMult(g)-1)*0.5,0.7,1.4); }

/* ---------- 隊上定位 ---------- */
/* 同樣的綜合，在 PLG 是當家、在 NBA 只是輪替——這就是「我 78 綜合為什麼只有 8 分」的答案。
   先換算成同儕標準分數，再讓名氣／順位／體系適配去推移，最後才切等級。
   注意：這跟球探報告上的「同儕定位」不是同一把尺，也不該是——同儕定位問的是
   「你在這個聯盟排第幾」（純綜合），隊上定位問的是「教練怎麼用你」（還吃名氣、
   選秀順位、體系適配、底薪約）。實測約 0.6% 的職業球季兩者會差兩級以上
   （例如同儕「先發」配上隊上「邊緣人」），那是體系適配與底薪約造成的，不是 bug。 */
/* 隊上定位的三條分界。v1.4.0 加了名單線之後**母體換掉了**（裸 z<0.70 的人整批被裁），
   倖存者的分佈整個右移，而這三條線沒有跟著重切：實測 87,352 個職業球季是
   當家 30.38%／先發 57.79%／輪替 11.32％／板凳末端 0.50%，
   而 `數值設定.md` 寫的是 12.1／52.1／29.0／6.8——四級制實質上只剩兩級，
   74% 的職業生涯至少當過一季當家球星。
   名氣那一項也是同一個病的一半：職業球季的名氣中位數是 99、49.3% 直接頂在 100，
   `roleOf` 的名氣項有 61.8% 貼在上限——對半數球季那不是區別度，是常數偏移。
   所以名氣改成「40 以下不推、100 才吃滿 +0.35」，當家的門檻同步從 2.35 抬到 2.60。
   （只抬門檻不動名氣的話先發會爆到 75.6%；只動名氣不抬門檻則輪替救得回來但當家仍偏高。）
   PLG 40.9% vs NBA 7.6% 的當家梯度**刻意保留**——那正是「小池塘大魚」該有的樣子。 */
const ROLE_Z={star:2.60,starter:1.00,rotation:-0.30};
function roleOf(g,ovr){
  const L=LEAGUES[g.league];
  let z=(ovr-L.bar)/L.sd;
  z+=clamp((g.fame-40)/60,0,1)*0.35;                /* 名氣最多推 +0.35 個標準差 */
  if(g.stage==='pro'&&isMinDeal(g)) z-=1.0;
  if(g.stage==='pro'&&g.stageYear<=1&&g.flags.pickNo)
    z+=g.flags.pickNo<=3?0.7:g.flags.pickNo<=8?0.35:0;
  if(g.fit==='good') z+=0.45;
  else if(g.fit==='bad') z-=0.45;
  if(trait(g,'cancer')) z-=0.5;
  if(trait(g,'captain')) z+=0.25;
  if(trait(g,'hero')) z+=0.25;
  if(z>=ROLE_Z.star) return 'star';
  if(z>=ROLE_Z.starter) return 'starter';
  if(z>=ROLE_Z.rotation) return 'rotation';
  return 'bench';
}
/* 體系適配：換隊不再是純好處 */
const FIT={
  good:{n:'完美契合',grow:1.10,d:'教練把體系繞著你的長處重畫，練什麼都吃得進去。'},
  ok  :{n:'普通',    grow:1.00,d:'不特別合，也不彆扭。'},
  bad :{n:'格格不入',grow:0.90,d:'戰術跑起來永遠慢半拍，成長與上場時間都被拖住。'},
};
function rollFit(g){
  const gp=clamp(0.30+g.a.iq/380+g.a.mind/480-(trait(g,'cancer')?0.16:0),0.10,0.62);
  const bp=clamp(0.30-g.a.iq/460-g.a.mind/560+(trait(g,'cancer')?0.16:0),0.05,0.45);
  const r=g._rng();
  g.fit=r<gp?'good':(r>1-bp?'bad':'ok');
  return g.fit;
}

/* ---------- 階段標籤 ---------- */
/* 「這一年在服役」只有這一個判準。amateur 的 pay 是 0，而 landingSpots 只收 pay>0 的
   聯盟，所以「在社會甲組」永遠等於「在役期」，不會誤傷降級的人。
   標籤（stageLabel）與事件池（eventStage）都讀它——以前兩邊各寫一次同一個條件。 */
function isGapYear(g){ return g.league==='amateur'; }
function stageLabel(g){
  /* 役期那一年 stage 還是 'hs'（明年要再問一次高中畢業的抉擇），但打的是社會甲組，
     標籤不可以印成「高三」——那一年他已經畢業了。 */
  if(isGapYear(g)) return '役期・社會甲組';
  if(g.stage==='hs') return '高'+['一','二','三'][g.stageYear-1];
  if(g.stage==='uba') return '大'+['一','二','三','四'][g.stageYear-1];
  if(g.stage==='ncaa') return 'NCAA 第 '+g.stageYear+' 年';
  if(g.stage==='pro') return '職業第 '+g.stageYear+' 年';
  return '退休';
}

/* ---------- 季初：擲骰 ---------- */
/* 加練投籃：每季 N 次出手，逐球判定，連續命中會發燙 */
const SHOTS=[
  {k:'swish',n:'空心',v:6,make:1},
  {k:'make', n:'進球',v:4,make:1},
  {k:'bank', n:'打板',v:3,make:1},
  {k:'rim',  n:'彈框',v:1,make:0},
  {k:'air',  n:'麵包',v:0,make:0},
];
/* 最高檔的 s 以前是 8，而 shotCount 的可達上限就是 7（高中 6 ＋天才 1，或職業 5 ＋天才
   ＋鐵人）——實測 43,004 次加練，最長連中 7、該檔位觸發 0 次，是結構性死內容。
   改成 7 之後它的意思變成「這一輪一球沒失手」，比原本的「連中 8 記」更好講，
   而且真的發得出來。`regress` 的【加練】有一條守著三個檔位都要抽得到。 */
const HEAT=[{s:7,m:1.55,n:'完全無視籃框'},{s:6,m:1.32,n:'手感發燙'},{s:4,m:1.16,n:'找到手感'}];

function shotCount(g){
  let n=4;
  if(g.stage==='hs') n=6;
  else if(g.stage==='uba'||g.stage==='ncaa') n=6;
  else if(g.age<=23) n=5;
  else if(g.age<=27) n=4;
  else if(g.age<=30) n=3;
  else n=2;
  if(trait(g,'genius')) n+=1;
  if(trait(g,'ironman')) n+=1;
  if(g.load>=80) n-=1;
  /* 這一行以前是死碼：季初加練發生在 startSeason，而當時讀的旗標要到 startResult
     才會被設起來、又在同一支函式的結尾清掉，加練看到的永遠是 false。
     改看上一季的紀錄，「上季受傷 → 今年加練少一次」才真的成立。

     判準是**重傷或整季報銷**，不是「有沒有受傷」。v1.7.0 讓 seasons[].injury 收得到
     三條受傷路徑（見 markInjury）之後，用 `last.injury||last.miss` 會讓這一格從 8.8%
     的球季擴大到 25%——而受傷率跟打法正相關，於是它變成專打積極打法的懲罰：
     實測認真玩的 CI P90 掉 7.1%、隨手玩只掉 1.9%，「認真玩／隨手玩」的 PR90 倍率
     從 1.11× 塌到 1.04×（`npm run stats` 的「回報要開在頂端」那一條轉黃）。
     小傷本來就已經付過代價了（體能 −1~3、負荷 −12、當季出賽打 55~85 折、連續全勤歸零），
     再加一格是重複收費。所以履歷照實記三條路徑（那是這條發現真正要修的顯示真相），
     但**加練這一格只看重傷**——這是量出來的取捨，不是漏掉。 */
  const last=g.seasons[g.seasons.length-1];
  if(last&&(last.miss||last.injury==='severe')) n-=1;
  return Math.max(1,n);
}
/* 手感分佈：投籃／三分／心理越好，空心與進球的比重越高 */
function shotOdds(g){
  const touch=(g.a.shoot*0.5+g.a.three*0.3+g.a.mind*0.2)/100;
  const t=clamp((touch-0.5)*2,-1,1);
  const p=[
    clamp(0.14+t*0.07,0.04,0.30),   /* 空心 */
    clamp(0.32+t*0.05,0.22,0.42),   /* 進球 */
    0.26,                            /* 打板 */
    clamp(0.19-t*0.05,0.10,0.28),   /* 彈框 */
    clamp(0.09-t*0.07,0.01,0.20),   /* 麵包 */
  ];
  const sum=p.reduce((s,v)=>s+v,0);
  return p.map(v=>v/sum);
}
function startTrain(g){
  const n=shotCount(g),odds=shotOdds(g),shots=[];
  let run=0,best=0;
  for(let i=0;i<n;i++){
    let r=g._rng(),idx=SHOTS.length-1;
    for(let j=0;j<odds.length;j++){ r-=odds[j]; if(r<=0){ idx=j; break; } }
    const s=SHOTS[idx];
    shots.push({k:s.k,n:s.n,v:s.v,make:s.make,hot:false});
    if(s.make){ run++; if(run>best) best=run; } else run=0;
    if(s.k==='swish') g.swishes++;
  }
  /* 標出最長連續命中那一段，讓玩家看得到手感是從哪裡燒起來的 */
  const heat=HEAT.find(h=>best>=h.s)||null;
  if(heat){
    let cur=0,end=-1;
    for(let i=0;i<shots.length;i++){
      if(shots[i].make){ cur++; if(cur===best){ end=i; break; } } else cur=0;
    }
    if(end>=0) for(let i=end-best+1;i<=end;i++) shots[i].hot=true;
  }
  if(g.age<TG.geniusAge&&g.swishes>=TG.geniusSwish) addTrait(g,'genius');
  const raw=shots.reduce((s,x)=>s+x.v,0);
  g.phase='train';
  g.pending={type:'train',shots:shots,raw:raw,streak:best,
             heat:heat?heat.m:1,heatName:heat?heat.n:'',
             base:Math.round(raw*(heat?heat.m:1))};
}
const INTENSITY={
  push  :{k:'push',n:'全力以赴',fl:'',        mult:1.5,load:11,hurt:0.16},
  normal:{k:'normal',n:'正常訓練',fl:'照課表走。',mult:1.0,load:5,hurt:0.05},
  safe  :{k:'safe',n:'保守應對',fl:'重訓改復健。',mult:0.6,load:-9,hurt:0.01},
};
/* 球季態度：決定這一季怎麼打（影響數據、獎項機會、負荷與季中傷病） */
const SEASON={
  allin :{k:'allin', n:'全力衝刺',fl:'搶數據、搶獎項。',
          stat:1.18,award:1.45,load:10,hurt:0.075,gp:1.04},
  steady:{k:'steady',n:'正常出賽',fl:'照教練調度走。',
          stat:1.00,award:1.00,load:5, hurt:0.03,gp:1.00},
  manage:{k:'manage',n:'控制上場時間',fl:'輪休保養。',
          stat:0.82,award:0.62,load:-9,hurt:0.005,gp:0.86},
};
/* 機率的文字表示。0.4% 用 Math.round 印出來是「0%」，玩家會理解成「這個選擇不會斷韌帶」，
   但預設設定下每季 0.39%、20 季生涯累積 7.6%，而重傷會永久砍掉天賦上限。 */
function pctText(v){
  if(v>0&&v<0.005) return '<1%';
  if(v<1&&v>0.995) return '>99%';
  return Math.round(v*100)+'%';
}
const sgn=v=>v<0?'−'+Math.abs(v):'+'+v;
/* 訓練強度／球季態度按鈕上的說明。數字一律現算，不可以在字串裡再抄一份——
   按鈕上的基準值（16%／7.5%）會被負荷與天生體質放大：紙糊體質＋負荷 >88 時，
   全力以赴實際是 72%（4.5 倍）、全力衝刺是 53%（7 倍），而玩家就是看著這個數字
   在決定這一季要不要拚。g 省略時退回基準值（給文件與測試用）。 */
function intensityDesc(g,k,att){
  const IT=INTENSITY[k];
  const p=g?injuryRisk(g,k,att||g.attitude||'steady').train:IT.hurt;
  return `${IT.fl}訓練點數 ×${IT.mult}，負荷 ${sgn(IT.load)}，訓練受傷率 ${pctText(p)}。`;
}
function seasonDesc(g,k,intens){
  const S=SEASON[k];
  const p=g?injuryRisk(g,intens||g.flags.intensity||'normal',k).season:S.hurt;
  return `${S.fl}場均 ×${S.stat}、獎項機會 ×${S.award}，負荷 ${sgn(S.load)}，季中受傷率 ${pctText(p)}。`;
}
function trainPoints(g,intensity){
  return Math.max(1,Math.round(g.pending.base*INTENSITY[intensity].mult));
}
/* 分配一點的實際成長（越接近潛力上限越難練；球風與體系適配都會放大或縮小） */
function gainFor(g,k,already){
  const cur=g.a[k]+already, cap=g.pot[k];
  if(cur>=cap) return 0;
  const room=1-Math.pow(clamp(cur/cap,0,1),2.8);
  let ageF=1;
  if(g.age<=18) ageF=1.2; else if(g.age<=22) ageF=1.05;
  else if(g.age<=26) ageF=0.85; else if(g.age<=29) ageF=0.6;
  else if(g.age<=32) ageF=0.38; else ageF=0.22;
  const st=(STYLES[g.style]||STYLES.allround).grow[k]||1;
  const ft=(FIT[g.fit]||FIT.ok).grow;
  /* 最後一點只給「還塞得下」的部分：不然畫面上畫的天賦上限會被越過，
     游標跑到刻度右邊，看起來像壞掉 */
  return Math.min(cap-cur,Math.max(0.10,room*2.05*ageF*st*ft));
}
/* 預覽整批分配的結果 */
function previewAlloc(g,alloc){
  const out={};
  for(const k in alloc){
    let acc=0;
    for(let i=0;i<alloc[k];i++) acc+=gainFor(g,k,acc);
    out[k]=Math.round(acc*10)/10;
  }
  return out;
}
/* 貪婪分配：每一點都投給「位置權重 × 這一點的實際成長」最高的那一項。
   這是**唯一一份**——UI 的「自動分配」按鈕、calib 的參考分佈、stats 的量測、
   四套測試的自動玩家全部呼叫它。以前這十行在六個檔案裡各抄一份，而且分裂成兩種行為
   （calib-body.js 一個檔案裡兩支函式就用了不同版本），實測 84% 的局會走出不同人生，
   參考分佈的 P80 差 0.9%——「PR 80 ＝ 贏過八成人」那個承諾就是靠參考分佈定義的。

   第三個參數傳的是「這一批已經累積的成長值」而不是點數：傳點數會低估已投入的進度，
   害貪婪法一直往同一項倒點。gainFor 在 cur>=cap 時回 0，所以不必另外檢查天賦上限。
   純函式，不擲骰。 */
/* 實作只有這一份，greedyAlloc 與 gateAlloc 都走它（傳入已經配掉的 alloc／acc 當起點）。
   權重的預設值以前寫成 `|| 0.01`，而權重 0 是 falsy——控球的籃板權重剛好是 0，
   於是「這個位置完全不吃籃板」被悄悄當成「權重 0.01」。改成問 null。
   （這段註解不可以把那個運算式原樣寫出來：audit【F】拿它當「只有一份」的指紋。） */
function greedyInto(g,pts,alloc,acc){
  const w=POS[g.pos].w;
  for(let i=0;i<pts;i++){
    let best=null,bs=-1,bg=0;
    for(const at of ATTRS){
      const gain=gainFor(g,at.k,acc[at.k]||0);
      if(gain<=0) continue;
      const s=(w[at.k]!=null?w[at.k]:0.01)*gain;
      if(s>bs){ bs=s; best=at.k; bg=gain; }
    }
    if(!best) break;
    alloc[best]=(alloc[best]||0)+1;
    acc[best]=(acc[best]||0)+bg;
  }
  return alloc;
}
function greedyAlloc(g,pts){ return greedyInto(g,pts,{},{}); }
/* 門檻感知的分配。`greedyAlloc` 對**綜合**是精確最佳解（可分離 ＋ 邊際遞減的背包，
   構造保證），但綜合不是生涯裡唯一的門檻：高中畢業要走 NCAA 得同時過
   `posGate`（綜合）與 `posAttrGate(pos,'iq',NCAA_IQ_GATE)`（球商）兩道門，
   而貪婪法只看綜合的邊際，對單屬性的門檻完全是盲的。

   實測（配對 6,000 局）：學生階段先把球商補到門檻、剩下的點才貪婪，
   CI +2.6%（t=9.9）、走過 NCAA 8.2%→11.1%，小前鋒那一格是 3.8%→10.6%（2.8 倍）。
   而進過 NCAA 的人 CI 均值 14,109、沒進的 8,606——那道門後面的槓桿就是這麼大。
   三組反證確認是門檻在作用，不是「多練球商本來就好」：補到門檻 +15（多補的浪費掉）
   只 +1.4%、補到門檻 −8（還是跨不過去）+0.10%（t=0.84，等於 0）、
   同樣形狀但補一個沒有門檻擋著的屬性（心理）+0.03%（t=0.14，等於 0）。

   **`greedyAlloc` 本身一個字都不動**：它是 `CI_PCTL`／`LEGEND_SC` 那張參考分佈的定義
   （`autoplay-body.js` 呼叫的就是它），動它等於偷偷改掉「PR 80」的意思。
   這是 UI 上多一顆按鈕，不是把舊按鈕換掉。純函式，不擲骰。 */
function gateAlloc(g,pts){
  const gate=posAttrGate(g.pos,'iq',NCAA_IQ_GATE);
  if(g.stage!=='hs'||g.a.iq>=gate) return greedyAlloc(g,pts);
  const alloc={},acc={};
  let left=pts;
  while(left>0&&g.a.iq+(acc.iq||0)<gate){
    const gain=gainFor(g,'iq',acc.iq||0);
    if(gain<=0) break;
    alloc.iq=(alloc.iq||0)+1; acc.iq=(acc.iq||0)+gain; left--;
  }
  return greedyInto(g,left,alloc,acc);
}
function applyTrain(g,intensity,alloc,attitude){
  const IT=INTENSITY[intensity];
  g.attitude=SEASON[attitude]?attitude:'steady';
  const before=overall(g);
  const gains=previewAlloc(g,alloc);
  const deltas=[];
  for(const k in gains){
    if(gains[k]<=0) continue;
    /* 上限夾在天賦上限，不是 99——畫面上畫了刻度就不能越過 */
    g.a[k]=clamp(Math.round((g.a[k]+gains[k])*10)/10,0,g.pot[k]);
    deltas.push({k:k,v:gains[k]});
  }
  g.load=clamp(g.load+IT.load+SEASON[g.attitude].load+(g.pos==='C'?2:0)
               -(g.a.ath>=80?2:0)+duraLoad(g),0,100);
  g.flags.intensity=intensity;

  const card={kind:'train',title:'季初訓練 — '+IT.n,eyebrow:stageLabel(g),
    body:trainNarrative(g,intensity)+'　'+seasonPlanNarrative(g,g.attitude),
    deltas:deltas,ovr:[before,overall(g)]};

  /* 訓練受傷判定 */
  let hurtP=(IT.hurt+(g.load>70?0.10:0)+(g.load>88?0.14:0))*duraMult(g);
  if(trait(g,'glass')) hurtP+=0.08;
  if(trait(g,'steel')) hurtP-=0.04;
  hurtP=clamp(hurtP,0,0.75);
  if(g._rng()<hurtP){
    const inj=doInjury(g,'train');
    card.injury=inj;
  }
  g.log.push(card);
  startEvent(g);
  return card;
}
function trainNarrative(g,it){
  const t={
    push:['天還沒亮就到球館，最後一個關燈。','加練到手指起水泡，教練叫你回去你沒回。','重訓室的數字一週跳一次，膝蓋也一週痛一次。'],
    normal:['照著課表走完一季，不多不少。','該練的練，該休的休，穩穩地過。','跟著隊友一起，沒有落隊也沒有超前。'],
    safe:['把重量放下，改做恢復與柔軟度。','physio 說再拚下去就要開刀，你聽進去了。','這一季先把身體養回來。'],
  }[it];
  return pick(g._rng,t);
}
function seasonPlanNarrative(g,att){
  return {
    allin :'這一季你打算把自己榨乾。',
    steady:'球季就照教練的調度走。',
    manage:'背靠背你打算跳過幾場，把身體留到最後。',
  }[att]||'';
}

/* ---------- 負荷與受傷風險（供 UI 即時顯示，純計算不動狀態） ---------- */
const LOAD_FLOOR=12;   /* 負荷的地板：休到底也還有這麼多底噪，不可能是 0 */
/* 季末的自然回落。**這是唯一一份**——`startResult` 與負荷帳本面板都讀它。
   回落隨年齡遞減：三十歲以後恢復得慢，同樣的打法會慢慢把負荷推上去。 */
function loadDrain(g){
  const base=(g.stage==='hs'?10:8)+(g.a.ath>=85?2:0);
  return Math.round(base*(g.age<=21?1.3:g.age<=27?1.0:g.age<=32?0.7:0.45));
}
function loadBand(v){
  if(v>=88) return {k:'danger',n:'危險',d:'再撞一次就是手術檯。'};
  if(v>=70) return {k:'warn',  n:'警戒',d:'受傷率明顯拉高，該考慮輪休了。'};
  if(v>=45) return {k:'mid',   n:'累積中',d:'還撐得住，但沒有本錢再硬拚太久。'};
  return {k:'ok',n:'輕鬆',d:'身體是乾淨的，這時候拚最划算。'};
}
function injuryRisk(g,intensity,attitude){
  const IT=INTENSITY[intensity],S=SEASON[attitude]||SEASON.steady;
  const projLoad=clamp(g.load+IT.load+S.load+(g.pos==='C'?2:0)
                       -(g.a.ath>=80?2:0)+duraLoad(g),0,100);
  const dm=duraMult(g);
  let tp=(IT.hurt+(projLoad>70?0.10:0)+(projLoad>88?0.14:0))*dm;
  if(trait(g,'glass')) tp+=0.08;
  if(trait(g,'steel')) tp-=0.04;
  tp=clamp(tp,0,0.75);
  let sp=(S.hurt+(projLoad>70?0.09:0)+(projLoad>88?0.13:0))*dm;
  if(trait(g,'glass')) sp+=0.06;
  if(trait(g,'steel')) sp-=0.03;
  sp=clamp(sp,0,0.6);
  const any=1-(1-tp)*(1-sp);
  const sevGiven=projLoad>=88?0.34:0.05;
  /* severe 一定要乘 duraSevere——引擎擲的是 roll<0.34*sm 與 roll<0.05*sm（sm=duraSevere），
     少乘的話紙糊體質的人畫面上看到的重傷率會比實際低四成（鐵律 2）。
     數值設定.md 的公式本來就寫著 ×duraSevere，是這裡漏了。 */
  return {load:projLoad,train:tp,season:sp,any:any,
          severe:any*sevGiven*duraSevere(g),band:loadBand(projLoad)};
}
/* 負荷來源／消除來源，UI 說明面板直接吃這份資料，改數值不用改文案 */
function loadLedger(g){
  const c=g.pos==='C'?2:0, ath=g.a.ath>=80?-2:0, dl=duraLoad(g), db=duraBand(g.dura);
  const up=[
    {n:'全力以赴訓練',v:'+'+INTENSITY.push.load},
    {n:'正常訓練',   v:'+'+INTENSITY.normal.load},
    {n:'全力衝刺球季',v:'+'+SEASON.allin.load},
    {n:'正常出賽',   v:'+'+SEASON.steady.load},
    {n:'打國際賽',v:'+10'},
    /* 集訓事件（p_natl_camp 的「去」）掛的是 +12，跟打國際賽的 +10 不一樣，
       合成一行寫「+10」的話帳本會少算 2 */
    {n:'中華隊集訓（事件）',v:'+12'},
    {n:'中鋒的禁區消耗',v:c?'+2（你是中鋒）':'+2（僅中鋒）'},
  ];
  const down=[
    {n:'保守應對訓練',v:INTENSITY.safe.load},
    {n:'控制上場時間',v:SEASON.manage.load},
    /* 這一行的數字一定要從 loadDrain 現算：它含年齡遞減（≤21 ×1.3／≤27 ×1.0／
       ≤32 ×0.7／其餘 ×0.45）與「體能 85 以上再多回落 2」，寫死的話三十歲以後就在說謊。
       體能那道門檻是 85，跟下面那條「恢復力 80」是兩個不同的判定。 */
    {n:`季末自然回落（${g.age} 歲${g.a.ath>=85?'、體能 85 以上':''}）`,v:'−'+loadDrain(g)},
    {n:'體能 80 以上的恢復力',v:ath?'−2（已生效）':'−2（體能需達 80）'},
    {n:'受傷休養',v:'小傷 −12／重傷 −30'},
    /* 地板也要列出來：不列的話玩家會以為「一直保守」可以把負荷歸零。
       但它是**季末回落**的地板，不是負荷的全域下限——賽季中的事件（例如「進入輪休管理」
       的 −22）照樣壓得到 0。字面上要說清楚是哪一種，不然就是畫面在講一件程式沒做的事。 */
    {n:'季末回落的地板（回落再多也停在這裡）',v:'⤓ '+LOAD_FLOOR},
    {n:'開刀清創（事件選項）',v:'−45'},
  ];
  if(dl>0) up.push({n:`天生體質「${db.n}」`,v:'+'+dl});
  else if(dl<0) down.push({n:`天生體質「${db.n}」`,v:String(dl)});
  const dm=duraMult(g);
  return {
    up:up,down:down,
    dura:{band:db,val:g.dura,load:dl,mult:dm,
      note:`天生體質是開局就由種子決定的，練不動也治不好。你抽到的是「${db.n}」——${db.d}`
        +(dm===1?'受傷率不加不減，負荷累積也是基準值。'
          :`所有受傷判定一律 ×${dm}，負荷累積 ${dl>0?'+':''}${dl}。`)
        +(dm>1?'　乘法的意思是：你拚得越兇，體質的懲罰放大得越多——'
              +`保守應對只有 ${Math.round(INTENSITY.safe.hurt*dm*100)}% 上下，`
              +`全力以赴會被放大到 ${Math.round(INTENSITY.push.hurt*dm*100)}%。`
             :dm<1?'　乘法的意思是：你比別人有本錢拚，同樣的全力以赴，你的受傷率只有 '
                   +`${Math.round(INTENSITY.push.hurt*dm*100)}%（一般人 ${Math.round(INTENSITY.push.hurt*100)}%）。`:'')},
    /* 34% 不可以寫死：引擎擲的是 0.34 × duraSevere，紙糊體質的人實際會到 47%。
       這一行的數字要跟 doInjury 同一個來源算出來（鐵律 2）。 */
    rule:`負荷是永久累積的暗傷值，不會自己歸零。超過 70 每季受傷率 +9~10%；`
        +`超過 88 時，一旦受傷有 ${Math.round(0.34*duraSevere(g)*100)}% 會直接演變成`
        +`前十字韌帶或跟腱斷裂（缺一整季、體能永久掉、天賦上限也會跟著降）。`
        +`這個比例已經算進你的天生體質「${db.n}」。`,
  };
}

/* ---------- 傷病 ---------- */
/* 履歷上那一格「本季傷勢」的唯一來源。
   doInjury 有三個呼叫點——季初訓練（applyTrain）、季中事件（applyEvent）、球季中（startResult）——
   而 seasons[] 以前只讀結果卡的 card.injury，於是前兩條路整段漏記：
   實測 11,547 次受傷只有 3,920 次進得了履歷（漏 66%）。
   現在三條路都往 g.flags.seasonInjury 記一筆，取最嚴重的那一個，寫完 seasons 之後清掉。
   這一格同時是 shotCount 判「上季受傷 → 今年少加練一次」的依據，兩邊同一份。 */
function markInjury(g,severe){
  if(severe||g.flags.seasonInjury!=='severe') g.flags.seasonInjury=severe?'severe':'minor';
}
function doInjury(g,src){
  const roll=g._rng();
  const sm=duraSevere(g);
  const severe=(g.load>=88&&roll<0.34*sm)||(roll<0.05*sm);
  if(severe){
    g.injuries++;
    g.preInjuryOvr=Math.max(g.preInjuryOvr,overall(g));
    const kind=g.pos==='C'||g.pos==='PF'?'跟腱斷裂':'前十字韌帶斷裂';
    g.a.ath=clamp(g.a.ath-ri(g._rng,7,13),10,99);
    g.a.def=clamp(g.a.def-ri(g._rng,2,6),10,99);
    g.a.mind=clamp(g.a.mind-ri(g._rng,0,5),10,99);
    g.pot.ath=clamp(g.pot.ath-ri(g._rng,4,10),20,99);
    /* 現值砍 7~13、天花板只砍 4~10，所以砍完可能剩下「現值高過自己的天花板」。
       這裡跟 createGame 的方向刻意相反：重傷砍掉的是**你以後能到哪裡**，
       既然天花板下來了，現值就得跟著下來——不然畫面上的游標一樣會越過刻度。 */
    g.a.ath=Math.min(g.a.ath,g.pot.ath);
    g.load=clamp(g.load-30,0,100);
    g.flags.missSeason=true; g.streakFull=0; g.proStreak=0;
    markInjury(g,true);
    if(g.injuries>=TG.glassInjuries) addTrait(g,'glass');
    return {severe:true,text:`${kind}。手術、復健、看著隊友比賽，這一季報銷了。`};
  }
  const days=ri(g._rng,10,45);
  g.a.ath=clamp(g.a.ath-ri(g._rng,1,3),10,99);
  g.load=clamp(g.load-12,0,100);
  g.streakFull=0; g.proStreak=0;
  markInjury(g,false);
  const kinds=['腳踝翻船','膝蓋積水','腰部拉傷','手指骨裂','腿後肌拉傷'];
  return {severe:false,text:`${pick(g._rng,kinds)}，缺席約 ${days} 天。`};
}

/* ---------- 賽季中事件 ---------- */
/* 役期那一年打的是社會甲組，但 stage 刻意留在 'hs'（明年還要再跳一次「高中畢業」那張卡）。
   以前 eventPool 只看 stage，於是 582 個役期球季 100% 抽高中事件池——19 歲的替代役
   會打黑豹旗、被導師拿成績單威脅、再長高一次。
   判準跟 stageLabel() 共用 isGapYear()，不是各寫一次同一個條件。 */
function eventStage(g){ return isGapYear(g)?'amateur':g.stage; }
function eventPool(g){
  const st=eventStage(g);
  return EVENTS.filter(e=>e.st.indexOf(st)>=0
    && (!e.once||!g.flags['ev_'+e.id])
    && (!e.cond||e.cond(g)));
}
/* 同一段敘事一輩子看三次以上，實測佔 81.2% 的人生（≥4 次 46.9%、最多重複 12 次）。
   21 個事件配一局約 17.5 次抽取，而每個階段的池子只有 4~11 個，光靠 `once` 救不了——
   實測只加 once 是 81.2%→79.3%（幾乎沒動），因為把事件從池子裡拿掉反而讓剩下的更常出現。
   真正有效的是「看過就降權」：權重除以 (1 + K × 看過幾次)。K=0.8 實測
   ≥3 次 81.2%→66.0%、≥4 次 46.9%→21.4%、最多重複 12→8，相異事件 10.7→12.0，
   而且不會把設計好的權重抹平（w=3 的事件看過兩次還有 1.15，仍高於沒看過的 w=1）。
   **這不動亂數順序**：抽事件永遠只擲一次骰，改的是那一次骰落在誰身上。 */
const EV_REPEAT_K=0.8;
function evWeight(g,e){
  const seen=(g.evSeen&&g.evSeen[e.id])||0;
  return (e.w||1)*(e.fav&&e.fav===g.style?2.4:1)/(1+EV_REPEAT_K*seen);
}
function startEvent(g){
  if(g.flags.missSeason){ g.phase='event'; g.pending=null; startResult(g); return; }
  const pool=eventPool(g);
  const total=pool.reduce((s,e)=>s+evWeight(g,e),0);
  let r=g._rng()*total,ev=pool[pool.length-1];
  for(const e of pool){ r-=evWeight(g,e); if(r<=0){ ev=e; break; } }
  g.evSeen[ev.id]=(g.evSeen[ev.id]||0)+1;
  g.phase='event';
  /* p＝成功率（0~1）。UI 只顯示粗略帶，不給精確數字：要讓玩家知道自己在賭什麼，
     但不變成算數學。單一來源，顯示與實際擲骰不可能對不上。 */
  g.pending={type:'event',ev:ev.id,title:ev.t,text:typeof ev.x==='function'?ev.x(g):ev.x,
             opts:ev.o.map(o=>({label:o.l,desc:o.d,kind:o.k,p:o.p?o.p(g):null}))};
}
function applyEvent(g,idx){
  const ev=EVENTS.find(e=>e.id===g.pending.ev);
  const opt=ev.o[idx];
  if(ev.once) g.flags['ev_'+ev.id]=true;
  const before=overall(g);
  const ok=opt.p?(g._rng()<opt.p(g)):true;
  const res=ok?opt.ok:(opt.bad||opt.ok);
  const deltas=[];
  /* 顯示的是實際吃進去的量，不是名目值——頂到天賦上限時寫「+3」但只加了 0 是在騙玩家 */
  if(res.a) for(const k in res.a){
    const v=res.a[k],got=bumpAttr(g,k,v);
    deltas.push({k:k,v:got,capped:v>0&&got<v-0.05?v:0});
  }
  if(res.load) g.load=clamp(g.load+res.load,0,100);
  if(res.fame) g.fame=clamp(g.fame+res.fame,0,100);
  if(res.money) g.money+=res.money;
  if(res.pot) for(const k in res.pot) g.pot[k]=clamp(g.pot[k]+res.pot[k],20,99);
  if(res.ego) g.egoCount++;
  /* 街球王的說明寫「高中時期」，而役期那一年 stage 還是 'hs'（明年要再問一次畢業抉擇）。
     「河濱球場」v1.7.0 起也掛在役期池裡，不擋的話 19 歲的替代役會替他的高中生涯記一筆。 */
  if(res.gutsy&&!isGapYear(g)) g.gutsyHS++;
  if(res.trait) addTrait(g,res.trait);
  /* 逗號分隔，一個選項可以設多個旗標 */
  if(res.flag) String(res.flag).split(',').forEach(f=>g.flags[f]=true);
  /* 報銷一季就不可能是全勤——doInjury 的重傷分支有歸零，事件設 missSeason 的路徑也要有，
     不然「開刀休一季」的人會一邊報銷一邊累積連續全勤 */
  /* 「開刀清創，休一季」是唯一不經過 doInjury 就報銷整季的路徑。
     它**不可以**在履歷上記成「重傷」：`G.injuries` 只有 doInjury 會加，
     而履歷抬頭的重傷格讀的就是它——記了就會出現「那一季掛著重傷標籤，
     但抬頭寫重傷 0」，而且它也沒有砍天賦上限、沒有算進玻璃人。
     那一季本來就會以 `miss` 進履歷（抬頭有「報銷球季」那一格），這樣才對得起來。 */
  if(g.flags.missSeason){ g.streakFull=0; g.proStreak=0; }
  /* 事件層級的換隊：跟合約年的 trade: 走同一套（換隊、重置年資、重擲體系適配）。
     這裡會多擲兩次骰，但只在玩家真的選了「要求交易」而且談成的時候——
     加在該機制被觸發的時候，不加在共同路徑上。 */
  if(res.trade&&teamPool(g.league).length>1){
    const pool=teamPool(g.league).filter(t=>t!==g.team);
    g.team=pick(g._rng,pool);
    if(g.teamsPlayed.indexOf(g.team)<0) g.teamsPlayed.push(g.team);
    g.teamSwitches++;                 /* 浪人數的是這個，不是 teamsPlayed（見 TG.journeySwitches） */
    g.sameTeamYears=0; g.sameTeamStar=0;
    rollFit(g);
  }
  if(g.egoCount>=TG.cancerEgo) addTrait(g,'cancer');
  if(g.gutsyHS>=TG.streetGutsy&&g.stage==='hs') addTrait(g,'streetking');

  const card={kind:'event',title:ev.t,eyebrow:'賽季中 · '+stageLabel(g),
    body:res.x,deltas:deltas,ok:ok,ovr:[before,overall(g)]};
  if(res.hurt&&g._rng()<res.hurt) card.injury=doInjury(g,'event');
  g.log.push(card);
  startResult(g);
  return card;
}

/* 你替球隊帶來的那一份（0～0.42），剩下的 0.58 是隊友，每季重擲。
   吃的是**相對同儕**的實力 (ovr−bar)/sd，不是絕對綜合：舊版寫 (ovr−50)/50，
   於是同一個綜合在 HBL 與在 NBA 對球隊戰績的貢獻是同一個數字，
   HBL 的球隊永遠很爛（綜合 51 只帶來 0.008）、NBA 的球員永遠帶隊很強。 */
function teamAbility(g,ovr){
  const L=LEAGUES[g.league];
  return clamp(0.30+(ovr-L.bar)/L.sd*0.20,0,1)*0.42;
}
/* 奪冠：基準率是「這個聯盟有幾支球隊」，再由球隊強度上下拉。
   舊版是 clamp((teamStr−0.52)×1.5,0,0.55)，而 teamStr 只吃絕對綜合——
   把 179,658 個可擲冠軍的球季丟進 Poisson–binomial 精確檢定，11 個聯盟的 |z| 全部 <2.3：
   **聯盟、球隊、隊上定位對冠軍的邊際解釋力是 0**（NBA 的輪替球員跟當家球星的
   奪冠率一模一樣）。後果是六隊的 PLG 每季 7.0%（1/6＝16.7%）、三十隊的 NBA
   每季 16.4%（1/30＝3.3%）——玩家在自己最有優勢的聯盟裡系統性地少拿戒指，
   在最難的聯盟裡多拿五倍。而冠軍是名人堂最大的票倉：只把冠軍抽掉，入選人數掉 51.3%。

   這條跟「奪冠是一次擲骰、沒有季後賽過程」那個刻意暫緩的缺口不是同一件事——
   缺口講的是「沒有流程」，就算維持一次擲骰，那次擲骰照樣可以吃聯盟隊數與球隊強度。 */
const CHAMP_LO=0.30, CHAMP_HI=2.6;
function champOdds(k,teamStr){
  return clamp((1/LEAGUES[k].teams)*(CHAMP_LO+CHAMP_HI*clamp((teamStr-0.30)/0.55,0,1.3)),0,0.55);
}
/* ---------- 季末：模擬數據 ---------- */
function simSeason(g){
  const L=LEAGUES[g.league],a=g.a,ovr=overall(g);
  const rng=g._rng;
  const S=SEASON[g.attitude||'steady'];
  const R=ROLES[g.role]||ROLES.starter;
  const ST=STYLES[g.style]||STYLES.allround;
  const miss=g.flags.missSeason;
  /* 出賽場次：以該聯盟的例行賽場數為底，健康的人打 82~100%，上季受傷的人 55~85%。
     只擲一次骰（跟舊版一樣），順序不變。
     最後要夾在例行賽場數以內——全力衝刺的 gp 係數是 1.04，不夾的話會打出
     「NBA 一季 85 場」這種例行賽根本沒有的場次。 */
  const gp=miss?0:Math.min(L.gm,
    Math.round(L.gm*(g.flags.seasonInjury?0.55+rng()*0.30:0.82+rng()*0.18)*S.gp*R.gp));

  if(miss){
    /* 整季報銷也要算球隊強度：球隊照打，冠軍也照發（見 startResult 的 champ）。
       舊版在這裡直接回傳、把冠軍關在 else 裡，於是「你受傷缺陣，球隊還是照打」
       這句就在下面二十行處，機制卻是「報銷 ⇒ 一定沒有戒指」。 */
    return {gp:0,pts:0,reb:0,ast:0,stl:0,blk:0,hi:0,fg:0,tp:0,ft:0,
            rec:'—',ovr:ovr,miss:true,role:g.role,teamStr:teamAbility(g,ovr)+rng()*0.58};
  }
  /* 得分是「你比這個聯盟的防守好多少」，不是你的絕對數字除以難度——
     所以弱聯盟的當家可以砍 26 分，同一個人到 NBA 只是輪替就剩 5 分。 */
  const off=(a.shoot*0.95+a.three*0.85+a.handle*0.45+a.ath*0.55+a.iq*0.25)/380;
  const edge=clamp((ovr-L.bar)/L.sd,-2.6,3.6);        /* 相對同儕的標準分數 */
  const skill=clamp(off,0.25,0.85);
  const usage=R.u*clamp(0.86+edge*0.075,0.64,1.20);
  let pts=(4.2+skill*11.0+Math.max(0,edge)*3.6)*usage*L.pace;
  /* 籃板助攻抄阻仍看絕對能力，但聯盟強度只做溫和折價（不然頂級中鋒到 NBA 會消失） */
  const d2=Math.pow(L.diff,0.55);
  let reb=(0.8+(a.reb*0.062+a.ath*0.020)*(g.pos==='C'?1.28:g.pos==='PF'?1.14:g.pos==='SF'?0.82:0.52))/d2;
  let ast=(0.4+(a.pass*0.045+a.iq*0.020)*(g.pos==='PG'?1.62:g.pos==='SG'?0.90:g.pos==='SF'?0.64:0.42))/d2;
  let stl=(0.2+(a.def*0.012+a.iq*0.006)*(g.pos==='PG'||g.pos==='SG'?1.2:0.8))/d2;
  let blk=(0.05+(a.def*0.011+a.ath*0.007)*(g.pos==='C'?1.9:g.pos==='PF'?1.2:0.45))/d2;
  /* 副項也跟著定位縮放，不然板凳球員會刷出先發等級的籃板助攻 */
  reb*=R.sec; ast*=R.sec; stl*=R.sec; blk*=R.sec;

  if(trait(g,'chucker')) ast*=0.8;
  if(trait(g,'sniper')) pts*=1.06;
  /* 球風傾斜：射手多得分、組織核心多助攻、禁區支柱多阻攻 */
  pts*=(ST.tilt.pts||1); reb*=(ST.tilt.reb||1); ast*=(ST.tilt.ast||1);
  stl*=(ST.tilt.stl||1); blk*=(ST.tilt.blk||1);
  /* 球季態度直接乘在場均上 */
  pts*=S.stat; reb*=S.stat; ast*=S.stat; stl*=S.stat; blk*=S.stat;
  const v=()=>0.86+rng()*0.28;
  pts=Math.max(0,pts*v()); reb=Math.max(0,reb*v()); ast=Math.max(0,ast*v());
  stl=Math.max(0,stl*v()); blk=Math.max(0,blk*v());
  /* 場均得分不設軟上限：滿天賦球員賴在弱聯盟刷到 50 分是刻意允許的結果
     （這是「留在小池塘當大魚」這條路線該有的回報，勿再加 KNEE/ASYM 之類的壓縮） */

  /* 命中率：投籃／三分／罰球，聯盟越強越難投 */
  const dz=L.diff-1;
  const fg=clamp(0.362+(a.shoot*0.5+a.ath*0.3+a.iq*0.2)/100*0.200-dz*0.052
                 +(rng()-0.5)*0.035,0.29,0.63);
  const tp=clamp(0.238+a.three/100*0.225-dz*0.055+(rng()-0.5)*0.055,0.12,0.48);
  const ft=clamp(0.500+(a.shoot*0.6+a.mind*0.4)/100*0.420+(rng()-0.5)*0.05,0.40,0.95);
  /* 單季最高得分：里程碑「單場 40／50／60 分」看這個。
     場均越高的人爆發倍率越低（大量出手的人本來就每場都在高檔），
     但**打得越多場，撞到那一場爆發的機會也越大**——一季 82 場的人跟一季 16 場的人
     不可能同一條分佈。以 40 場為基準，NBA 一季 +0.16、HBL 一季 −0.11。 */
  const gpBoost=clamp((gp-40)/42*0.18,-0.12,0.18);
  const hiMult=1.66+rng()*0.78-clamp((pts-18)/40,0,0.38)+gpBoost;
  const hi=gp>0?Math.min(99,Math.round(pts*hiMult+rng()*4)):0;

  /* 球隊戰績：自身實力 + 隊友（亂數）。
     戰績算的是球隊整季，不是你出賽的場次——你受傷缺陣，球隊還是照打。 */
  const teamStr=teamAbility(g,ovr)+rng()*0.58;
  const total=L.gm;
  const win=clamp(Math.round(total*(0.28+teamStr*0.52)),0,total);
  return {gp:gp,pts:r1(pts),reb:r1(reb),ast:r1(ast),stl:r1(stl),blk:r1(blk),hi:hi,
          fg:Math.round(fg*1000)/10,tp:Math.round(tp*1000)/10,ft:Math.round(ft*1000)/10,
          w:win,l:total-win,rec:win+'勝'+(total-win)+'敗',ovr:ovr,teamStr:teamStr,role:g.role};
}

/* 年薪：畫面與結算共用這一份。
   舊公式在頂端整個壓平——實測 NBA 年薪中位數 1.65 億（約 US$520 萬，跟現實對得上），
   但天花板只有 3 億（約 US$950 萬），而現實 NBA 頂薪是中位數的十倍以上。
   「打成超級巨星」這件事在薪水上完全看不出來，所以另外加一段頂薪合約：
   只有 tier ≥ 7 的聯盟開得出來，而且要當家球星才吃得滿。 */
function payFor(g,ovr,role){
  const L=LEAGUES[g.league];
  if(!L.pay) return 0;
  const R=ROLES[role]||ROLES.starter;
  const base=(60+Math.pow(clamp(ovr-45,0,55),1.72)*1.15)*L.pay;
  const maxK=L.tier>=7?clamp((ovr-84)/12,0,1):0;         /* 綜合 84 起跳，96 吃滿 */
  /* 頂薪的規模要跟這個聯盟的錢成正比，不能只看 tier：
     G League 也是 tier 7，但它的薪資係數是 0.55——不按比例縮的話，
     G League 的頂薪會開到比 B.LEAGUE 還高、是 PLG 上限的兩倍，
     跟它自己的說明「標準合約比國內主力還少」正好相反。 */
  const star=1+maxK*(role==='star'?3.6:role==='starter'?1.1:0.2)*clamp(L.pay/14,0,1);
  return Math.round(base*(1+g.fame/160)*(1+(trait(g,'bizmind')?0.1:0))
                    *R.pay*star*(isMinDeal(g)?0.3:1));
}
function startResult(g){
  const rng=g._rng;
  /* 季中傷病：由球季態度、當前負荷與天生體質決定 */
  let midInjury=null;
  if(!g.flags.missSeason){
    const S=SEASON[g.attitude||'steady'];
    let p=(S.hurt+(g.load>70?0.09:0)+(g.load>88?0.13:0))*duraMult(g);
    if(trait(g,'glass')) p+=0.06;
    if(trait(g,'steel')) p-=0.03;
    if(rng()<clamp(p,0,0.6)) midInjury=doInjury(g,'season');
  }
  /* 這一季你在隊上是什麼角色——要在模擬數據之前定下來 */
  g.role=roleOf(g,overall(g));
  const s=simSeason(g);
  const R=ROLES[g.role],L=LEAGUES[g.league];
  const before=overall(g);
  const awards=[];
  const card={kind:'result',title:g.year+' 球季結算',eyebrow:stageLabel(g)+' · '+LEAGUES[g.league].n,
    stats:s,awards:awards,deltas:[],team:g.team,attitude:g.attitude||'steady',
    role:g.role,fit:g.fit,peer:peerRank(g,s.ovr)};
  if(midInjury) card.injury=midInjury;

  /* 冠軍在 miss 分支**外面**擲：球隊照打，你在場邊也照樣拿戒指。
     報銷的球季拿不到的是總冠軍賽 MVP 與「關鍵先生」（他根本沒上場）。 */
  const champ=rng()<champOdds(g.league,s.teamStr);
  if(champ){
    g.champs++; if(g.stage==='pro') g.proChamps++;
    awards.push(LEAGUES[g.league].short+(g.stage==='pro'?' 總冠軍':' 冠軍'));
    card.champ=true;
    if(!s.miss&&g.a.mind>=TG.clutchMind) addTrait(g,'clutch');
    /* 常勝軍算的是職業冠軍：三座 HBL／UBA 冠軍對強隊的學生來說太便宜了 */
    if(g.proChamps>=TG.dynastyChamps) addTrait(g,'dynasty');
    /* 原本這裡發的是「傷癒歸來」，而且條件掛在一個根本沒定義的 redeem 特質上
       （trait() 永遠回傳 false）。毒瘤奪冠跟傷癒歸來是兩回事，改發浪子回頭。 */
    if(trait(g,'cancer')) addTrait(g,'redeem');
  }

  if(s.miss){
    card.body=champ
      ? `整季報銷。${g.name}在場邊看完了 ${g.team} 的每一場比賽——包括最後那一場。`
        +`戒指有你的一份，但那不是你想要的拿法。`
      : `整季報銷。${g.name}在場邊看完了 ${g.team} 的每一場比賽。`;
    g.flags.missSeason=false;
    g.awards.push(...awards.map(x=>({y:g.year,t:x,lg:LEAGUES[g.league].short})));
    if(champ) g.fame=clamp(g.fame+7,0,100);
  }else{
    /* 出賽全勤 */
    if(!g.flags.seasonInjury){
      g.streakFull++;
      if(g.stage==='pro'){ g.proStreak++; if(g.proStreak>g.bestProStreak) g.bestProStreak=g.proStreak; }
    }
    /* 用 proStreak：streakFull 含高中大學，實測會出現「職業第 1 年就拿到鐵人」 */
    if(g.proStreak>=TG.ironStreak) addTrait(g,'ironman');
    if(g.load>=TG.steelLoad&&!g.flags.seasonInjury) addTrait(g,'steel');

    /* 隊上定位累計（看板球星／萬年板凳） */
    if(g.stage==='pro'){
      if(g.role==='star'){ g.starYears++; g.sameTeamStar++; if(g.sameTeamStar>=TG.franchiseYears) addTrait(g,'franchise'); }
      else g.sameTeamStar=0;
      /* 門檻從 5 季降到 3 季：名單線上線之後，聯盟不會再讓人在板凳末端坐五年——
         坐到第四季的人早就被裁掉了。維持 5 季等於把這個特質變成死內容，
         而且說明會承諾一條已經不存在的生涯路線。 */
      if(g.role==='bench'){ g.benchYears++; if(g.benchYears>=TG.benchYears) addTrait(g,'benchwarm'); }
    }
    /* 獎項：球季態度與隊上定位一起放大或縮小整體得獎機會 */
    const ovr=s.ovr;
    const AW=SEASON[g.attitude||'steady'].award*R.award;
    /* 大獎也要看你這一季打成什麼樣子，不是只看綜合——
       舊版的 MVP 只由綜合與定位決定，實測會發出「場均 10.3 分的年度 MVP」，
       而那三座 MVP 又直接把他送進名人堂。用的是畫面上看得到的那份數據（貢獻值），
       而且刻意不乘聯盟難度：MVP 是聯盟內部的獎，要跟同聯盟的人比，
       「PLG 的 MVP 不等於 NBA 的 MVP」交給名人堂票數那邊的聯盟份量處理。 */
    const prod=contribOf(s);
    const mvpK=prodK(g.league,prod,1.00);
    const teamK=prodK(g.league,prod,0.70);
    if(champ&&rng()<clamp((ovr-62)/45,0,0.7)*teamK) awards.push('總冠軍賽 MVP');
    /* 態度與定位的加成一律夾住上限，避免「當家＋全力衝刺」變成年年保送 */
    const awp=p=>clamp(p*AW,0,0.92);
    /* 五個大獎的門檻與形狀全部走 awardGate／awardOdds（每個聯盟自己一份）。
       擲骰刻意排在門檻判定**前面**：`if(ovr>=門檻 && rng()<p)` 的 && 是短路的，
       門檻沒過時 rng() 根本不會被呼叫——於是「調一格門檻」就等於「動亂數順序」，
       所有公布過的種子當場失效。先抽再判之後，這五個門檻以後怎麼調都不會再動到亂數。 */
    const rAw=[rng(),rng(),rng(),rng(),rng()];
    if(ovr>=awardGate(g.league,'first')&&rAw[0]<awp(awardOdds(g.league,'first',ovr)*teamK))
      awards.push('年度第一隊');
    else if(ovr>=awardGate(g.league,'second')&&rAw[1]<awp(awardOdds(g.league,'second',ovr)*teamK))
      awards.push('年度第二隊');
    if(ovr>=awardGate(g.league,'mvp')&&rAw[2]<awp(awardOdds(g.league,'mvp',ovr)*mvpK))
      awards.push(LEAGUES[g.league].short+' 年度 MVP');
    if(g.stage==='pro'&&g.stageYear===1&&ovr>=awardGate(g.league,'rookie')
       &&rAw[3]<awp(awardOdds(g.league,'rookie',ovr))) awards.push('年度新人');
    /* 各項王的門檻是**每個聯盟自己一份**（kPts/kReb/kAst，實測該聯盟單季分佈的 p99）。
       舊版只分「NBA / 其他」兩檔：NBA 的得分門檻 31 高過該聯盟的實測上限 32.1，
       1,200 局只發出 1 座；同一條 28 分在 PLG／T1 卻是 448 與 440 座，
       而歐洲的單季上限只有 18.8，得分王與籃板王在那裡是純死內容。
       得分是「你比這個聯盟的防守好多少」，所以門檻本來就不可能是同一個絕對值。 */
    if(s.pts>=L.kPts&&rng()<0.5) awards.push('得分王');
    if(s.reb>=L.kReb&&rng()<0.5) awards.push('籃板王');
    if(s.ast>=L.kAst&&rng()<0.5) awards.push('助攻王');
    /* 防守第一隊看的是防守，不是綜合——綜合那道門跟年度第一隊同一條，
       差別在後面那一關。那一關以前寫 (def−74)/16，是**絕對值**：高階聯盟的人防守本來就高，
       於是這個獎在 EURO 32.1%、NBA 27.6%，比同聯盟的年度第一隊還常見，
       而 HBL／甲組／NCAA 是 0.00%。改成問「你的防守比你自己的綜合高多少」——
       這個獎要獎勵的是防守專精的人，而那件事在每個聯盟都問得出來。
       比的是 `rawOvr`（位置補正前）不是 `overall`：補正是加在回傳值上的，
       拿 overall 當基準的話，同樣一組屬性在小前鋒身上會被算成「防守比平均低 3」、
       在控球身上「高 1」——那個補正就在它本來要抹平的那條軸上製造出新的偏差。 */
    if(ovr>=awardGate(g.league,'def')&&s.gp>0
       &&rAw[4]<awp(awardOdds(g.league,'def',ovr)*clamp((g.a.def-rawOvr(g))/10+0.25,0,1)))
      awards.push('防守第一隊');

    g.awards.push(...awards.map(x=>({y:g.year,t:x,lg:LEAGUES[g.league].short})));
    g.fame=clamp(g.fame+awards.length*4+(champ?7:0)+clamp((s.pts-8)*0.5,0,7),0,100);

    /* 累計 */
    g.career.gp+=s.gp; g.career.seasons++;
    g.career.pts+=s.pts*s.gp; g.career.reb+=s.reb*s.gp;
    g.career.ast+=s.ast*s.gp; g.career.stl+=s.stl*s.gp; g.career.blk+=s.blk*s.gp;
    g.career.fg+=s.fg*s.gp; g.career.tp+=s.tp*s.gp; g.career.ft+=s.ft*s.gp;
    if(s.hi>g.career.hiGame) g.career.hiGame=s.hi;
    if(g.streakFull>g.bestStreak) g.bestStreak=g.streakFull;

    /* 薪水：隊上定位直接反映在合約上 */
    if(LEAGUES[g.league].pay>0){
      const pay=payFor(g,ovr,g.role);
      g.money+=pay; card.pay=pay; card.minDeal=isMinDeal(g);
    }
    card.body=seasonNarrative(g,s,champ,awards);
  }

  g.seasons.push({y:g.year,age:g.age,lg:LEAGUES[g.league].short,team:g.team,stage:stageLabel(g),
                  ovr:s.ovr,pts:s.pts,reb:s.reb,ast:s.ast,stl:s.stl||0,blk:s.blk||0,
                  fg:s.fg||0,tp:s.tp||0,ft:s.ft||0,
                  hi:s.hi||0,gp:s.gp,rec:s.rec||'—',pay:card.pay||0,att:g.attitude||'steady',
                  role:g.role,load:Math.round(g.load),
                  injury:g.flags.seasonInjury||null,   /* 三條受傷路徑都在裡面，見 markInjury */
                  awards:awards.slice(),champ:!!card.champ,miss:!!s.miss});
  /* 屬性特質檢查（要在本季寫進 seasons 之後，獨食怪才看得到當季數據） */
  checkAttrTraits(g);
  /* 里程碑：長生涯的追逐目標（同樣要在本季寫進 seasons 之後） */
  card.miles=checkMilestones(g);
  /* 老化 */
  ageDecline(g,card);
  /* 負荷自然回落。以前是定額 −8（高中 −10），而「控制上場時間」是 −9、
     「全力以赴」只有 +11——最強的訓練配最輕的球季每季淨 −6，於是負荷可以被永久存在 0。
     實測那個組合的季初負荷中位數只有 2～3、**0.0% 的球季負荷超過 70**，
     底下這一整套東西在最優玩法下是關著的：loadBand 的「警戒（>45）」「危險（>70）」、
     injuryRisk 的 >70／>88 兩段加成、鋼鐵意志（負荷 ≥85，取得率 0.1%）、
     「膝蓋在說話」事件（cond 負荷 ≥55）。

     兩個改動，都不去動「控制上場時間」的明面代價（實測把那個水槽關掉會讓玻璃人
     從 3% 炸到 60%，副作用比原本的病大得多）：
     ① **地板**：負荷洩不到 0，身體永遠有一點底噪。
     ② **回落隨年齡遞減**：三十歲以後恢復得慢，同樣的打法會慢慢把負荷推上去——
        老將繼續拚就會走進警戒帶，而那正是這個機制本來要講的事。 */
  g.load=clamp(Math.max(LOAD_FLOOR,g.load-loadDrain(g)),0,100);
  const nowOvr=overall(g);
  if(nowOvr>g.bestOvr){ g.bestOvr=nowOvr; if(g.age>=TG.latebloomAge) addTrait(g,'latebloom'); }
  if(g.preInjuryOvr>0&&nowOvr>=g.preInjuryOvr) addTrait(g,'comeback');
  card.ovr=[before,nowOvr];
  card.newTraits=g._newTraits.slice(); g._newTraits=[];
  g.log.push(card);

  /* 本季的傷勢已經寫進 seasons[]，下一季重新累積。
     v1.7.0 之前這裡清的是 `injuredLast` 與 `seasonInjury` 兩個旗標，而它們是同一件事的
     兩本帳（都由 doInjury 設、同一刻清、同一個意思）——出賽場次折扣、全勤、鋼鐵意志
     現在全部改問 seasonInjury，只剩這一份。 */
  g.flags.seasonInjury='';
  g.phase='result';
  g.pending={type:'result'};
}
/* 里程碑：只回報這一季新解鎖的 */
function checkMilestones(g){
  const got=[];
  const P=proStats(g);          /* 只算職業球季，算一次給 14 個里程碑共用 */
  for(const m of MILESTONES){
    if(g.milestones.indexOf(m.k)>=0) continue;
    if(m.f(g,P)){ g.milestones.push(m.k); got.push(m); }
  }
  return got.map(m=>({k:m.k,n:m.n}));
}
function seasonNarrative(g,s,champ,aw){
  const rng=g._rng;
  if(champ) return pick(rng,[`終場哨響，${g.team} 的板凳全空了。你站在人堆最中間。`,
    `${g.team} 拿下冠軍。回程遊行的車上，你一句話都說不出來。`,
    `冠軍。這一年所有的加練，在最後一節全部兌現。`]);
  if(aw.length) return pick(rng,[`個人數據漂亮，球隊沒走到最後。${s.rec}。`,
    `你被寫進賽季回顧，但獎盃在別人手上。`]);
  if(g.role==='bench') return pick(rng,[`名單上有你，輪表上沒有。多數夜晚你在計時器倒數時才脫掉外套。`,
    `這一季你練球比比賽認真，因為只有練球才上得了場。`]);
  if(g.role==='star') return pick(rng,[`球隊圍著你打。贏球是你的功勞，輸球也是。`,
    `每一場的第一個戰術都是給你的。${s.rec}。`]);
  if(s.pts<6) return pick(rng,[`上場時間零碎，多數時候在板凳上背戰術。`,`這一季你在輪替邊緣浮沉。`]);
  return pick(rng,[`一個不特別也不難堪的球季。`,`${s.rec} 收場，例行公事的一年。`,`數據平穩，教練說你「可以再多要一點球」。`]);
}
function checkAttrTraits(g){
  const a=g.a;
  if(a.three>=TG.sniperThree) addTrait(g,'sniper');
  if(a.ath>=TG.flyerAth) addTrait(g,'flyer');
  if(a.reb>=TG.paintkingReb) addTrait(g,'paintking');
  if(a.def>=TG.lockdownDef) addTrait(g,'lockdown');
  if(a.pass>=TG.generalPass&&a.iq>=TG.generalIq) addTrait(g,'general');
  if(a.handle>=TG.twoway&&a.three>=TG.twoway&&a.pass>=TG.twoway) addTrait(g,'twoway');
  if(a.ath>=TG.motor&&a.def>=TG.motor) addTrait(g,'motor');
  if(g.money>=TG.bizMoney) addTrait(g,'bizmind');
  if(g.stage==='pro'&&a.mind<TG.softMind) addTrait(g,'softheart');
  if(g.sameTeamYears>=TG.captainYears&&a.mind>=TG.captainMind) addTrait(g,'captain');
  if(g.teamSwitches>=TG.journeySwitches) addTrait(g,'journeyman');
  const last=g.seasons[g.seasons.length-1];
  if(last&&last.pts>=TG.chuckerPts&&last.ast<TG.chuckerAst) addTrait(g,'chucker');
}
function ageDecline(g,card){
  if(g.age<28) return;
  const rng=g._rng;
  /* 33／36／39 歲各再加一段：老化不是等速的，末段是懸崖。
     舊版只有 34 歲一段，於是巔峰綜合 90 的人到了 40 歲還有 78——市場永遠淘汰不掉他。
     實測舊版：退休年齡 p10/p50/p90 ＝ 35/38/42，33.7% 打到 40 歲以上、26.5% 打滿到 42 歲的
     硬上限，而且**在 NBA 打過的人，最後一季的年齡中位數是 42 歲**。
     這三段才是「極少人能超過 40 歲」真正的來源；市場門檻只是把結果收尾，
     光靠調市場會變成「還是聯盟最強的人卻沒球隊要」，那是另一種壞掉。
     加上三段之後：40 歲以上 3.1%，退休年齡中位數 36。 */
  const sev=(g.age-27)*0.42+(g.load>70?0.9:0)+(trait(g,'glass')?0.7:0)
           +(g.age>=33?1.6:0)+(g.age>=36?4.2:0)+(g.age>=39?9.5:0);
  const drops=[];
  const athD=-(0.6+rng()*sev*0.9);
  g.a.ath=clamp(Math.round((g.a.ath+athD)*10)/10,10,99); drops.push({k:'ath',v:r1(athD)});
  if(g.age>=30){
    const dD=-(0.3+rng()*sev*0.5);
    g.a.def=clamp(Math.round((g.a.def+dD)*10)/10,10,99); drops.push({k:'def',v:r1(dD)});
  }
  if(g.age>=32){
    const rD=-(0.3+rng()*sev*0.45);
    g.a.reb=clamp(Math.round((g.a.reb+rD)*10)/10,10,99); drops.push({k:'reb',v:r1(rD)});
    const hD=-(0.2+rng()*sev*0.4);
    g.a.handle=clamp(Math.round((g.a.handle+hD)*10)/10,10,99); drops.push({k:'handle',v:r1(hD)});
  }
  if(g.age>=29&&!trait(g,'latebloom')){
    bumpAttr(g,'iq',0.4);
  }
  /* 34 歲後手感與組織力也開始掉——不然傳球／三分／球商權重高的控衛永遠不會老 */
  if(g.age>=34){
    for(const k of ['shoot','three','pass','iq','mind']){
      const d=-(0.25+rng()*sev*0.32);
      g.a[k]=clamp(Math.round((g.a[k]+d)*10)/10,10,99); drops.push({k:k,v:r1(d)});
    }
  }
  card.decline=drops;
}

/* ---------- 進入下一年（含分岔） ---------- */
function advance(g){
  const br=takeNextBranch(g);
  if(br){ g.phase='branch'; g.pending=br; return; }
  stepYear(g);
}
function stepYear(g){
  g.age++; g.year++;
  g.stageYear++;
  g.sameTeamYears++;
  startTrain(g);
}

/* 這個季末要不要跳出抉擇——**這支不是純查詢**，名字用 take 開頭是刻意的警告。
   它會擲骰（overseasOffer 對每個候選報價擲一次、contractBranch 兩次、natlBranch 兩次），
   也會改狀態（askedEarly／faCooldown／natlCooldown／retireAskYear／retiredWhy）。
   實測同一個狀態連問兩次，65% 會給出不同的答案。

   所以「明年會發生什麼」的預覽、球探報告加一格「今年會不會有報價」、
   或測試裡多呼叫一次來斷言可用選項——**每一種都會把整條亂數序列往前推**，
   公布過的種子當場全部失效，而 audit 的開局指紋只釘得住 createGame 那一段，
   五套測試會全綠。要做預覽就得先把「決定要不要跳」跟「擲骰決定內容」拆開。

   下面那個斷言是這條規則的守門：一年只准問一次。它記的是純旗標，不進亂數路徑。 */
function takeNextBranch(g){
  if(g.flags.branchAskedYear===g.year)
    throw new Error('takeNextBranch 一年只能呼叫一次（第 '+g.year+' 年被問了第二次）——它會擲骰，'
      +'重複呼叫會讓所有公布過的種子失效');
  g.flags.branchAskedYear=g.year;
  const ovr=overall(g);
  /* 高三畢業 */
  if(g.stage==='hs'&&g.stageYear===3) return branchHSGrad(g,ovr);
  /* 大四畢業 / NCAA 結束 */
  if(g.stage==='uba'&&g.stageYear===4) return branchDraft(g,ovr,'大學畢業');
  if(g.stage==='ncaa'&&g.stageYear===4) return branchDraft(g,ovr,'NCAA 生涯結束');
  /* NCAA：大一打完就能宣告投入 NBA 選秀（現實的 one-and-done 規則——
     年滿 19 歲且離開高中滿一年即具資格）。而且每一年都能重新決定，不是一次性的。 */
  if(g.stage==='ncaa'&&g.stageYear>=1&&g.stageYear<=3&&nbaScout(g,ovr)>=NBA_SCOUT_GATE){
    const yn=['','大一','大二','大三'][g.stageYear];
    const opts=[{label:'宣告投入 NBA 選秀',
      desc:(g.stageYear===1?'一年即走。':'')+'中選就直接站上最高殿堂；落選就失去學生資格，只能從 G League 打起。',
      kind:'push',act:'nbaDraft',p:draftOdds(g,'nbaDraft')}];
    if(g.stageYear>=2) opts.push({label:'回台灣投國內選秀',
      desc:'放棄剩下的學業，回 P.LEAGUE+ 當即戰力。穩，但天花板也就到這裡。',
      kind:'norm',act:'earlyDraft',p:draftOdds(g,'earlyDraft')});
    opts.push({label:'留在學校再練一年',desc:'多一年養成，球探評價也會跟著漲。明年還能再決定一次。',kind:'safe',act:'stay'});
    return {type:'branch',title:`${yn}結束，要宣告參加選秀嗎？`,
      text:`球探把報告攤在桌上：現值綜合 ${ovr}、天花板 ${potOvr(g)}，`+
           `他們給你的評價是 ${nbaScout(g,ovr)}。\n\n`+
           (g.stageYear===1
             ? '「你現在還不成熟，但十九歲的天花板本身就是商品。要嘛現在賣，要嘛賭它三年後還在。」'
             : '「每多讀一年，你的天花板就少一分想像空間，多一分證據。哪一種比較值錢，沒有人說得準。」'),
      opts:opts};
  }
  /* UBA：大二／大三提前投入國內選秀（UBA 打不到 NBA 球探的名單） */
  if(g.stage==='uba'&&g.stageYear>=2&&ovr>=72&&!g.flags.askedEarly){
    g.flags.askedEarly=true;
    return {type:'branch',title:'提前投入選秀？',
      text:`才${g.stageYear==2?'大二':'大三'}，經紀人已經找上門：「你現在的行情就是首輪，再讀兩年風險太大。」`,
      opts:[
        {label:'放棄學業，投入選秀',desc:'立刻進職業，少兩年養成但早兩年領薪水。',kind:'push',act:'earlyDraft',
         p:draftOdds(g,'earlyDraft')},
        {label:'讀完再說',desc:'留在校隊把身體與球商練滿，畢業再投。',kind:'safe',act:'stay'},
      ]};
  }
  /* 職業：先看還有沒有人要（連降級都沒得降＝結束），再看要不要往下一階走，
     然後才是往上爬的海外報價、合約與國家隊，最後才問要不要自己收山 */
  if(g.stage==='pro'){
    const r=retireForced(g,ovr);
    if(r) return r;
    const dn=demotionBranch(g,ovr);
    if(dn) return dn;
    const os=overseasOffer(g,ovr);
    if(os) return os;
    const fa=contractBranch(g,ovr);
    if(fa) return fa;
    const nt=natlBranch(g,ovr);
    if(nt) return nt;
    const rq=retireQuestion(g,ovr);
    if(rq) return rq;
  }
  return null;
}

/* 選秀／測試的成功率：顯示與實際擲骰共用這一份，不可能對不上 */
/* 國內選秀的起算點。draftOdds 與球探報告共用這一個來源——
   球探報告以前自己寫死 46，而 draftOdds 早就改成 bar−11（PLG 51／T1 49），
   結果同一張卡片上面寫「綜合 46　你 48 ✓ 已達標」、下面寫「幾乎不可能」。 */
function draftGate(lg){ return LEAGUES[lg].bar-11; }
function draftOdds(g,act){
  const ovr=overall(g);
  /* NBA 選秀：用球探評價（現值＋天花板）而不是純現值。
     再扣一個「生嫩折價」——大一走的人身上還有三年沒打過的球，球隊要多賭一點。 */
  if(act==='nbaDraft'){
    const y=clamp(Math.round(g.stageYear),1,4);
    return clamp((nbaScout(g,ovr)-79)/16-(4-y)*0.04,0.03,0.72);
  }
  /* 畢業直闖海外：三個目的地共用同一條斜率，門檻本身決定難度。
     門檻當天約一成，門檻 +14 分才會到七成。 */
  if(act&&act.indexOf('try:')===0){
    const T=GRAD_TRYOUTS.find(x=>x.lg===act.slice(4));
    return T?clamp((ovr-(T.need-2))/22,0.1,0.7):null;
  }
  /* 國內選秀：門檻跟著目標聯盟自己的水準線走，不再是寫死的 46。
     寫死 46 的時候 PLG 的水準線是 62，而畢業生的實力中位數是 66——
     中選率中位數 97%、實際中選 92.9%，這一關等於不存在。
     改成 bar −11 起算之後實測中選 83%：篩掉的是尾巴，不是中間。
     這一關刻意不收得更緊——「進得去但三年後被裁掉」比「根本沒進去」是更好的故事，
     真正的淘汰交給名單線去做（實測職業六季內出局 16.7%）。 */
  if(act==='goDraft'||act==='goDraftT1'||act==='earlyDraft'){
    return clamp((ovr-draftGate(act==='goDraftT1'?'t1':'plg'))/16-(g.stage==='hs'?0.35:0),0.02,0.95);
  }
  return null;
}
const NCAA_GATE=64, HS_DRAFT_GATE=64, NCAA_IQ_GATE=55;
function branchHSGrad(g,ovr){
  const opts=[];
  const gN=posGate(g.pos,NCAA_GATE), gD=posGate(g.pos,HS_DRAFT_GATE);
  const gQ=posAttrGate(g.pos,'iq',NCAA_IQ_GATE);
  if(ovr>=gN&&g.a.iq>=gQ){
    opts.push({label:'挑戰美國 NCAA',desc:'球探看上你了。語言、體格、上場時間全部歸零重來，但那是通往 NBA 最近的路。',kind:'push',act:'goNCAA'});
  }
  opts.push({label:'升上 UBA 大專聯賽',desc:'四年養成，球商與身體都能補完，也拿得到文憑。畢業那年還能直接闖日本、韓國或澳洲。',kind:'norm',act:'goUBA'});
  if(ovr>=gD){
    opts.push({label:'高中畢業直接投入職籃選秀',desc:'放棄大學，18 歲挑戰 P.LEAGUE+／T1。早四年領薪水，但基本功可能永遠補不回來。',
      kind:'push',act:'goDraft',p:draftOdds(g,'goDraft')});
  }
  if(!g.flags.gapYear)
    opts.push({label:'先當替代役，一邊打業餘聯賽',desc:'保底路線。多一年準備，隔年再投選秀。',kind:'safe',act:'gap'});
  return {type:'branch',title:'高中畢業',
    text:`HBL 打完了。${g.name}的高中三年結束在這裡，接下來要選一條路。`+
         /* 條件要跟 NCAA 選項出現的條件一模一樣（綜合 ＋ 球商），
            不然球商沒過的人會看到「有海外球探留下聯絡方式」卻找不到那個選項 */
         (ovr>=gN&&g.a.iq>=gQ?'（球探報告：綜合 '+ovr+'，有海外球探留下聯絡方式。）'
           :ovr>=gN?'（球探報告：綜合 '+ovr+'，身手夠了，但球探說你的球場判斷還要再讀幾年書。）'
           :'（球探報告：綜合 '+ovr+'。）')+
         '\n\n出國不是只有美國那一條——先打國內職籃，日本、韓國、澳洲、歐洲的報價會自己找上門，只是每一層都有門檻。',
    opts:opts};
}
function branchDraft(g,ovr,why){
  const opts=[];
  /* 大四的 NBA 選秀跟大一到大三共用同一把尺（球探評價），不然會出現
     「大三 87 有七成、大四 86 只剩五趴」這種說不通的斷崖 */
  if(g.stage==='ncaa'&&nbaScout(g,ovr)>=NBA_SCOUT_GATE){
    opts.push({label:'投入 NBA 選秀',desc:'四年打完了，球探看的是你已經證明的東西。落選就得從 G League 打起。',
      kind:'push',act:'nbaDraft',p:draftOdds(g,'nbaDraft')});
  }
  opts.push({label:'投入 P.LEAGUE+ 選秀',desc:'國內最高殿堂。順位取決於你的綜合評價與名氣。',
    kind:'norm',act:'goDraft',p:draftOdds(g,'goDraft')});
  opts.push({label:'投入 T1 聯盟選秀',desc:'競爭略小，上場時間通常更多。',
    kind:'norm',act:'goDraftT1',p:draftOdds(g,'goDraftT1')});
  /* 畢業直闖海外：過得了哪一關就開哪一關，門檻越高的排越後面 */
  const abroad=GRAD_TRYOUTS.filter(T=>ovr>=T.need);
  for(const T of abroad) opts.push({label:'直接挑戰 '+T.label+' 測試',desc:T.desc,
    kind:'push',act:'try:'+T.lg,p:draftOdds(g,'try:'+T.lg)});
  return {type:'branch',title:why,
    text:`${g.name}，${g.age} 歲，綜合 ${ovr}。該決定往哪裡去了。`+
      (abroad.length>1?`\n\n海外那邊有 ${abroad.length} 扇門開著（${abroad.map(T=>T.label).join('、')}），`
        +'但每一扇都是一次性的試訓——沒過就得回台灣補選，順位還會掉。':''),
    opts:opts};
}
/* 市場價值：還有沒有球隊願意開合約，由實力扣掉年齡折價與傷病史、再加名氣決定。

   年齡折價原本是乘法（`ovr × f`），問題是它跟「聯盟門檻」對不起來：
   同一個折價比例，對綜合 90 的人砍掉 20 分，對綜合 60 的人只砍 13 分，
   結果強者反而更容易被砍出局，而弱者賴在原地。改成加法之後，
   「35 歲的身體要多付出多少代價」對每個人是同一個數字，跟門檻也對得上。 */
/* 年齡折價：27 歲之後每一年，市場對你的估值要扣掉多少分。
   28 起算是因為球隊買的是「接下來三年」，不是「上一季」。
   30→4.4　32→9.9　34→17.0　36→25.4　38→35.0　40→45.7　42→57.5
   這條曲線是照兩個定點量出來的：
   ① 綜合 62 的普通球員 34 歲左右會掉出 PLG 的門檻（實測退休年齡中位數 36）
   ② 綜合 90 以上的頂級球員撐得到 40（實測 40 歲以上 0.9%，就是「極少人」的意思） */
function ageDiscount(age){ return age<=27?0:Math.pow(age-27,1.60)*0.755; }
/* 年齡折價在越高階的聯盟越無情：NBA 的球隊有的是二十二歲的選擇，
   國內聯盟的老將卻還有票房、更衣室與門票價值——台灣的職業籃球確實有 38、40 歲
   還在先發的本土球員，那不是 bug。tier 4（PLG／T1）×0.85，tier 9（NBA）×1.23。

   沒有這個係數的話會出現：39 歲、綜合 82、剛拿完總冠軍與 FMVP 的 PLG 球員
   被系統判定「沒人要」——但他明明還是那個聯盟最強的人。`regress.js` ①盯著這件事。 */
function marketValue(g,ovr,lgK){
  const L=LEAGUES[lgK||g.league];
  return ovr-ageDiscount(g.age)*(0.55+L.tier*0.075)-g.injuries*3+clamp(g.fame/10,0,6);
}
/* 名單線：純實力，跟年紀無關——「你到底夠不夠格待在這個聯盟」。

   這條線以前不存在，只有下面的行情線 lgFloor（bar −1.9sd，PLG 是 49.6）。
   問題是菜鳥進 PLG 的實力中位數是 bar +7（綜合 69），等於買了 19 分的保險永遠用不到：
   實測 8,000 局裡 30 歲前被市場淘汰的只有 0.07%、職業三季內結束的 0.0%、職業年資 PR1 是 7 季，
   而 78.4% 的人死於 nomarket——整個遊戲只剩一種死法叫「老了」。

   兩條線是兩個問題，要分開問：
   ① 名單線（這裡）：二十四歲、綜合 55 的 PLG 球員不是「老了沒人要」，是本來就不該在這裡。
   ② 行情線（lgFloor）：實力扣掉年齡折價與傷病之後還剩多少，那是給老將的。
   分開之後，加嚴淘汰不會連帶砍短老將的生涯——老將的綜合遠在名單線之上，
   他們照樣是被行情線送走的，退休年齡的校準不受影響。 */
/* 線畫在 bar 之上，不是之下。這件事違反直覺，所以要寫清楚為什麼：
   bar 是聯盟裡「假想同儕」的中位數，但玩家從來不是從那個分佈抽出來的——
   能走到職業的人本來就是篩過的。實測職業球季的 z＝(綜合−bar)/sd 分佈是
   p2 0.00、p10 0.36、p50 1.17：低於水準線的球季只有 1.3%。
   把名單線畫在 bar 以下等於畫在空氣裡，怎麼調都不會淘汰任何人（實測 0.0%）。
   畫在 bar +0.70sd 起跳（新秀約結束當下 PLG ＝ 66.55，之後每季往上爬到封頂 67.20）
   的意思是「你至少要是個站得住的輪替」，
   對照 roleOf 的分級：z≥1.0 先發、z≥−0.30 輪替。六隊十二人的聯盟，
   板凳末端本來就每年換人——這條線就是那件事。 */
/* 而且這條線會**隨年資往上爬**，這是整個淘汰機制的關鍵。

   固定高度的名單線只會產生一次性的清洗：綜合是單調成長的，所以第四季沒被砍掉的人
   就永遠在線上（實測「三季內出局」與「六季內出局」是同一個數字 5.9%，中間完全沒有人）。
   那不是淘汰，是一道年資四年的閘門。

   會爬的線對應的是真實的事：菜鳥用潛力換上場時間，六年級生要拿貢獻換，
   十年級生得證明自己還是那個等級。線每年往上一點，於是每個人在**自己的實力對應的年份**
   被追上——z 0.4 的人第 4 季掉出去，z 0.7 的人第 9 季，z 1.0 的人第 14 季，
   而 z 1.2 以上的中位數球員永遠碰不到它（他是被年齡折價送走的，那條路徑沒有動）。
   生涯長度因此第一次真的跟實力連動，而不是所有人都打到 37 歲。 */
/* v1.6.0 之前是 Z0=0.70／SLOPE=0.05／GRACE=3，而那三個數字合起來是一把**斷頭台**，
   不是一條曲線：z 從 0.70 爬到封頂 0.80 只花兩季（proY 3→5），所以整條線實際上
   等於「第 3 季末一次結清」。實測 8,000 局的逐年出局率
   k1 0.00%／k2 0.00%／**k3 11.04%**／k4 0.37%／k5 1.28%／k6 0.51%……——
   六季內出局的人裡有 85.1% 剛好死在第三季末，27–31 歲的退休年齡幾乎是空的（3.04%）。
   原因是 draftGate('plg')＝51 與 PLG 名單線 66.55 之間差 15.5 分（2.4 個標準差），
   豁免期把這段落差存三年再一次結清。上面那段註解寫的「z 0.4 的人第 4 季掉出去、
   z 0.7 的人第 9 季、z 1.0 的人第 14 季」在 SLOPE=0.05／ZMAX=0.80 下算術上不可能成立。

   現在的三個數字是掃出來的：起點壓到新秀之下（PLG 58.1，低於進聯盟當下綜合的 p10＝63），
   斜率拉到 0.22（第 8 季到頂），豁免只留選秀當季。ZMAX 維持 0.80 跟 starExempt 對齊——
   把它往上調在數學上是 no-op（hasDeal 先判 starExempt，實測 31,286 個決策裡
   「過名單線但沒過 starExempt」是 0 個）。
   結果：單年最高危險率 3.40%（沒有柱子）、27–31 歲退休 3.04% → 10.56%、
   退休年齡 p10 26 → 30，而淘汰總量沒有被關掉（≤8 季出局 13.6% → 11.4%）。 */
const ROSTER_Z0=0.45,                      /* 選秀當季的名單線＝bar ＋ sd×0.45 */
      ROSTER_SLOPE=0.12,                   /* 之後每多一個職業球季，線再往上 0.12 個 sd */
      ROSTER_ZMAX=0.80;                    /* 封頂在 starExempt 的基準（bar ＋0.8sd），兩把尺不打架 */
const ROOKIE_GRACE=1;                      /* 新秀約的保底年限（沒有順位可查時用這個） */
/* 保障年限跟選秀順位走：樂透級三年、首輪兩年、其餘一年。
   固定年限會讓所有沒長起來的人在**同一年**一起被裁——舊版 GRACE=3 的後果是
   六季內出局的人有 85% 剛好死在第三季末，把 GRACE 改成 1 只是把那根柱子搬到第二季。
   順位本來就是「球隊願意等多久」的那個數字，用它來錯開，柱子才會散開。 */
function rookieGrace(g){
  const p=g.flags&&g.flags.pickNo;
  return !p?ROOKIE_GRACE:(p<=3?3:p<=10?2:1);
}
function proYearsOf(g){ let n=0; for(const s of (g.seasons||[])) if(isProSeason(s)) n++; return n; }
function rosterLine(k,proY){
  const L=LEAGUES[k];
  const z=clamp(ROSTER_Z0+ROSTER_SLOPE*((proY||0)-1),ROSTER_Z0,ROSTER_ZMAX);
  return L.bar+L.sd*z;
}
/* **這個人現在真正要跨過的那條線**（含在該聯盟的漸進豁免）。
   判定與畫面都讀它——`demotionBranch` 的卡片會把這個數字印給玩家看，
   印一條引擎沒有用的線，就是「畫面寫的門檻不是引擎在用的那一個」（鐵律 2）。
   保障年限內回 −Infinity：那段時間這條線不存在，而不是「線很低」。 */
function rosterLineFor(g,k){
  const proY=proYearsOf(g);
  if(proY<rookieGrace(g)) return -Infinity;
  const L=LEAGUES[k],line=rosterLine(k,proY);
  if(k!==g.league) return line;
  return L.bar+(line-L.bar)*clamp(yearsAtLeague(g,k)/4,0,1);
}
/* 你在**這個聯盟**連續待了幾季（往回數到換聯盟為止）。 */
function yearsAtLeague(g,k){
  const cur=LEAGUES[k].short;
  let n=0;
  for(let i=(g.seasons||[]).length-1;i>=0;i--){ if(g.seasons[i].lg===cur) n++; else break; }
  return n;
}
/* 這個聯盟還開不開得出合約給你。
   還在該聯盟的水準線（bar）以上就一定有約——沒有球隊會因為年紀放掉一個先發等級的人，
   39 歲拿完總冠軍與 FMVP 隔年沒人要，那是模型壞了不是老了（`regress.js` ①盯著）。
   年齡折價決定的是「你還剩多少緩衝」，不是「先發也能被折成沒人要」。
   真正讓人退休的是老化本身：37 歲之後綜合掉得很快，掉到水準線以下才輪到市場說話。 */
/* 上一季還拿得到大獎的人，市場不可能沒人要。年紀到了可以沒有球隊續約，
   但到那時你早就打不出大獎了——這條讓「拿完 MVP、隔年被裁掉」在結構上不可能發生，
   而不是靠調參數去閃。`regress.js` ①盯著這件事。 */
function hadBigAward(g){
  const s=g.seasons[g.seasons.length-1];
  return !!s&&s.awards.some(a=>a.indexOf('MVP')>=0||a==='年度第一隊');
}
/* 「先發等級不會被放掉」這個豁免本身也會老：
   球隊願意為 34 歲的先發留位子，對 40 歲的同一個人則要求他是全聯盟前幾名。
   34 歲以下＝水準線 +0.8 個標準差，之後每年再往上 0.38 個標準差。 */
function starExempt(k,age){
  const L=LEAGUES[k];
  return L.bar+L.sd*(0.8+clamp(age-34,0,8)*0.38);
}
/* 名單線的判定。新秀約的前三季豁免——被選進來的人有保障合約，球隊會給時間，
   沒有這個豁免的話 NBA 的樂透新秀會在十九歲那年就被自己的球隊裁掉。 */
function meetsRoster(g,ovr,k){
  const proY=proYearsOf(g);
  if(proY<rookieGrace(g)) return true;
  /* 剛簽進來的第一年也豁免——不然旅外報價就是一張一年期的票。
     六個旅外目的地的報價門檻**全部低於它自己的名單線**（B1 −2.8、KBL −3.8、
     GLG −2.4、NBA −4.0，一個例外都沒有），而 rosterLine 吃的是**總職業年資**：
     一個職業第 8 年的人剛簽進 NBA，會被當成 NBA 第 8 年的老將審。
     實測 1,708 段 NBA 生涯沒有一段是以升級或退休結束，100% 以降級收場，
     其中 80.9% 只待一季；8,369 次升級裡有 48.1% 是回到剛剛把自己裁掉的那個聯盟。
     `overseasOffer` 的註解白紙黑字寫著要防的就是這件事，補的 `canSignAt`
